async function home(){var z=await Promise.all([api("/infinity/3700/dashboard"),api("/infinity/studio/workspace/summary"),api("/infinity/3702/capabilities"),api("/infinity/studio/projects?limit=6")]);var d=z[0],s=z[1],c=z[2],rp=z[3];var m=d.metrics||{};$("main").innerHTML='<div class="card hero"><div class="eyebrow">DIRECTOR MODE · ONE COMMAND · REAL WORKFLOW · 3706</div><h1>Turn an idea into evidence, media, automation and outcomes.</h1><p class="muted">AI Infinity now joins the source-grounded notebook, creator production fabric, learned workflows and verified external-action gates in one operating surface.</p><div class="cmd"><textarea id="cmd" class="field area" placeholder="Create a 10-minute video about clean energy with research, script, storyboard, captions and publishing plan…"></textarea><button class="btn primary" onclick="command()">Run command</button></div></div><div class="metrics">'+metric("Active opportunities",m.active_opportunities||0)+metric("Verified earnings","$"+Number(m.verified_earnings||0).toFixed(2))+metric("Projects",s.projects||0)+metric("Local capabilities",(c.local||[]).length)+'</div>'+card("The complete loop",'<div class="grid3"><div class="item"><b>Understand</b><div class="muted">Sources, questions, evidence, citations.</div></div><div class="item"><b>Create</b><div class="muted">Briefs, scripts, storyboards, decks, quizzes.</div></div><div class="item"><b>Act</b><div class="muted">Projects, production, repeatable skills.</div></div><div class="item"><b>Verify</b><div class="muted">Post-conditions, simulation, quality gates.</div></div><div class="item"><b>Publish</b><div class="muted">Prepare destinations without false success.</div></div><div class="item"><b>Grow</b><div class="muted">Analytics, experiments, opportunity tracking.</div></div></div>')+card("Live workspace",items((rp.projects||[]).concat(d.activity||[]).slice(0,10)));$("rail").innerHTML=card("Capability state",'<div class="good">Core workspace is local-first.</div><p class="muted">'+(c.gated||[]).length+' external capabilities remain explicit gates.</p>')+card("Fast paths",'<div class="caps"><button class="pill" onclick="go(\'Knowledge\')">Research</button><button class="pill" onclick="go(\'Production\')">Produce</button><button class="pill" onclick="go(\'Automation\')">Automate</button><button class="pill" onclick="go(\'Engineering\')">Engineer</button></div>')}
async function command(){var v=$("cmd").value.trim();if(!v)return;try{var r=await createStudioJob({objective:v,title:"AI Infinity Content",duration:60,format:"short",aspect_ratio:"9:16",content_type:"video"});showStudioJob(r,"Command accepted")}catch(e){err(e)}}
function studioForm(){$("main").innerHTML='<div class="card hero"><div class="eyebrow">CREATE · REAL CONTENT PRODUCTION</div><h1>Idea → finished media.</h1><p class="muted">Real Creator Studio production: research, script, visuals, voice, music, captions, FFmpeg composition, QC and export.</p></div>'+card("Create content",'<input id="ct" class="field" value="My AI Infinity video"><textarea id="co" class="field area" placeholder="Describe exactly what you want to create…"></textarea><div class="grid"><select id="cf" class="field"><option value="short">Short / Reel / TikTok</option><option value="long">Long-form</option></select><select id="cd" class="field"><option value="60">60 seconds</option><option value="30">30 seconds</option><option value="120">2 minutes</option><option value="300">5 minutes</option></select><select id="ca" class="field"><option value="9:16">9:16 vertical</option><option value="16:9">16:9 landscape</option><option value="1:1">1:1 square</option><option value="4:5">4:5 portrait</option></select></div><br><div class="grid"><input id="cl" class="field" value="English" placeholder="Language"><input id="cv" class="field" value="en-US-AriaNeural" placeholder="Voice"></div><br><button class="btn primary" onclick="startStudio()">Create real content</button>')+card("Output",'<div id="jobout" class="empty">Nothing is rendering yet.</div>');$("rail").innerHTML=card("Included","Research · script · storyboard · visuals · voice · music · captions · video · thumbnail · SEO · social package · QC")+card("Truthful runtime","Actual media rendering is performed by the production worker. No fake instant completion.")}

async function startStudio(){var objective=$("co").value.trim();if(!objective)return toast("Describe the content first");try{var r=await createStudioJob({title:$("ct").value,objective:objective,duration:Number($("cd").value),format:$("cf").value,aspect_ratio:$("ca").value,language:$("cl").value,voice:$("cv").value,content_type:"video"});showStudioJob(r,"Production started")}catch(e){err(e)}}

async function knowledge(){var n=await api("/infinity/3701/knowledge/notebooks");var first=(n.notebooks||[])[0];$("main").innerHTML='<div class="card hero"><div class="eyebrow">KNOWLEDGE · SOURCE-GROUNDED</div><h1>Your evidence has a home.</h1><p class="muted">A NotebookLM-inspired source panel + grounded conversation + Studio. Add your own files or public URLs, then turn the same evidence into reports, decks, quizzes and media-ready narration.</p></div>'+card("Notebook",'<div class="cmd"><input id="nbtitle" class="field" placeholder="New notebook title"><button class="btn primary" onclick="makeNb()">Create</button></div><br><div class="grid"><div class="item"><div class="row"><b>Add public URL</b><span class="badge">HTTP/HTTPS</span></div><br><input id="nu" class="field" placeholder="https://example.com/article"><br><br><button class="btn" onclick="addWebSource()">Add URL source</button></div><div class="item"><div class="row"><b>Upload source</b><span class="badge">PDF · DOCX · PPTX · XLSX · TXT</span></div><br><input id="nf" class="field" type="file"><br><br><button class="btn" onclick="addFileSource()">Ingest file</button></div></div><br><div class="split"><div id="srcs" class="source-list">'+(first?'<div class="source on"><b>'+esc(first.title)+'</b><small>'+esc(first.notebook_id)+'</small></div>':'<div class="empty">Create a notebook to begin.</div>')+'</div><div><div id="chatlog" class="chatlog"><div class="bubble">Ask a question after adding evidence. Answers stay grounded in the selected notebook.</div></div><br><textarea id="nq" class="field area" placeholder="Compare the strongest claims across my sources…"></textarea><br><br><button class="btn blue" onclick="askNb()">Ask with citations</button> <button class="btn" onclick="deepResearch()">Deep research</button> <button class="btn" onclick="researchPlan()">Build research plan</button></div><div><div class="studio" id="studio"></div></div></div>');$("rail").innerHTML=card("Grounding","Every generated answer async function makeNb(){var r=await api("/infinity/3701/knowledge/notebooks",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({title:$("nbtitle").value})});window.nb=r.notebook.notebook_id;await loadNb(window.nb);toast("Notebook created")}

async function addWebSource(){if(!window.nb)return toast("Create/select a notebook first");var u=$("nu").value.trim();if(!u)return;if(!/^https?:\/\//i.test(u))return toast("Use a public http(s) URL");try{await api("/infinity/3702/notebooks/"+window.nb+"/web-source",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({url:u})});await loadNb(window.nb);toast("Web source added") }catch(e){err(e)}}
