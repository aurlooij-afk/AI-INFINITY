<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111b"><title>AI Infinity — Creator OS</title><style>
:root{--bg:#07111b;--p:#0c1926;--p2:#102131;--line:#20384a;--t:#eff8ff;--m:#8fa7b9;--a:#69e7ff;--a2:#907fff;--g:#65e3a0;--w:#ffd178;--r:#ff8095}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 0 0,#19334d,transparent 34%),radial-gradient(circle at 100% 0,#203d40,transparent 28%),var(--bg);color:var(--t);font:14px system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{padding:18px 13px;border-right:1px solid var(--line);background:#06101add;position:sticky;top:0;height:100vh}.logo{display:flex;gap:10px;align-items:center;padding:5px 8px 18px}.mark{display:grid;place-items:center;width:38px;height:38px;border:1px solid #31516b;border-radius:12px;background:#102638;font-size:22px;font-weight:900}.logo b{font-size:17px}.logo small{display:block;color:var(--m)}.nav{display:grid;gap:4px}.nav button{border:1px solid transparent;background:transparent;color:#aac0d0;text-align:left;border-radius:11px;padding:10px}.nav button:hover,.nav button.on{background:#102435;border-color:#24445a;color:#fff}.main{min-width:0}.top{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid var(--line);background:#07111bd9;backdrop-filter:blur(15px);position:sticky;top:0;z-index:5}.live{color:var(--g);font-size:12px}.wrap{max-width:1500px;margin:auto;padding:18px 20px 60px}.cols{display:grid;grid-template-columns:minmax(0,1fr) 315px;gap:15px}.card{background:linear-gradient(180deg,#102131f5,#0b1824f5);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 20px 70px #0005;margin-bottom:13px}.hero{background:radial-gradient(circle at 5% 0,#69e7ff1c,transparent 36%),radial-gradient(circle at 95% 10%,#907fff1c,transparent 30%),#0c1b29}.ey{color:var(--a);font-size:10px;font-weight:800;letter-spacing:.15em;text-transform:uppercase}.hero h1{font-size:clamp(29px,4vw,46px);line-height:1.03;margin:8px 0}.muted{color:var(--m)}.cmd{display:grid;grid-template-columns:1fr auto;gap:9px;margin-top:18px}.field{width:100%;background:#06101a;color:#fff;border:1px solid #29475c;border-radius:12px;padding:11px;outline:0}.area{min-height:100px;resize:vertical}.primary{background:linear-gradient(135deg,#7bedff,#a7d8ff);color:#06101a;border:1px solid #83efff;font-weight:800}.btn{border:1px solid #2b485b;background:#0b1925;color:#eef8ff;border-radius:11px;padding:10px 13px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:13px}.metric{padding:13px;border:1px solid var(--line);border-radius:14px;background:#07131f99}.metric small{display:block;color:var(--m)}.metric b{display:block;font-size:22px;margin-top:4px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.head h2{margin:0;font-size:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{border:1px solid var(--line);background:#07131f99;border-radius:12px;padding:12px}.row{display:flex;justify-content:space-between;gap:8px}.badge{border-radius:99px;padding:3px 7px;background:#12283a;color:#a9c3d3;font-size:10px}.good{color:var(--g)}.warn{color:var(--w)}.bad{color:var(--r)}.list{display:grid;gap:8px}.empty{border:1px dashed #315064;border-radius:12px;padding:22px;text-align:center;color:var(--m)}.mobile{display:none}.out{white-space:pre-wrap;overflow:auto;max-height:450px;background:#06101a;border:1px solid #1c3242;border-radius:12px;padding:12px;font-size:12px}@media(max-width:950px){.cols{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}@media(max-width:760px){.app{display:block}.side{display:none}.top{height:58px;padding:0 12px}.wrap{padding:12px 10px 78px}.cmd{grid-template-columns:1fr}.mobile{display:grid;position:fixed;bottom:0;left:0;right:0;height:62px;background:#06101af7;border-top:1px solid var(--line);grid-template-columns:repeat(5,1fr);z-index:20}.mobile button{background:transparent;border:0;color:#9bb1c1;font-size:10px}.mobile button.on{color:#fff}}
</style></head><body><div class="app"><aside class="side"><div class="logo"><div class="mark">∞</div><div><b>AI Infinity</b><small>Creator Operating System</small></div></div><div id="nav" class="nav"></div></aside><main class="main"><header class="top"><b id="title">Home</b><span id="live" class="live">● connecting</span></header><div class="wrap"><div class="cols"><section id="main"></section><aside id="rail"></aside></div></div></main></div><nav id="mobile" class="mobile"></nav><script>
var tabs=[["Home","⌂"],["Create","✦"],["Production","▶"],["Projects","▦"],["Intelligence","⌁"],["Assets","◫"],["Brand","◇"],["Publish","➤"],["Analytics","◒"],["Agents","◉"],["Operations","▤"],["Quality & Gaps","✓"],["System","⚙"],["Chat","◌"],["Notebook","▥"],["Engineering","⌘"],["Turbo 60","ϟ"]],cur="Home";
function $(x){return document.getElementById(x)}function esc(x){return String(x==null?"":x).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
async function api(u,o){o=o||{};o.credentials="include";var r=await fetch(u,o),j={};try{j=await r.json()}catch(e){j={detail:await r.text()}}if(!r.ok)throw Error(j.detail||"Request failed "+r.status);return j}
function nav(){var s="";tabs.forEach(function(t){s+='<button class="'+(t[0]==cur?"on":"")+'" onclick="go('+JSON.stringify(t[0])+')">'+t[1]+" "+esc(t[0])+"</button>"});$("nav").innerHTML=s;var m="";tabs.slice(0,5).forEach(function(t){m+='<button class="'+(t[0]==cur?"on":"")+'" onclick="go('+JSON.stringify(t[0])+')">'+t[1]+"<br>"+esc(t[0])+"</button>"});$("mobile").innerHTML=m}
function card(t,b){return '<div class="card"><div class="head"><h2>'+esc(t)+'</h2></div>'+b+"</div>"}function metric(t,v){return '<div class="metric"><small>'+esc(t)+'</small><b>'+esc(v)+'</b></div>'}function list(a){if(!a||!a.length)return '<div class="empty">Nothing recorded yet.</div>';return '<div class="list">'+a.map(function(x){return '<div class="item"><div class="row"><b>'+esc(x.name||x.title||x.event||"Item")+'</b><span class="badge">'+esc(x.stage||x.status||"ready")+'</span></div><div class="muted">'+esc(x.objective||x.source||"")+"</div></div>"}).join("")+"</div>"}
async function go(x){cur=x;nav();$("title").textContent=x;try{await render()}catch(e){$("main").innerHTML=card("Workspace error",'<div class="bad">'+esc(e.message)+"</div>")}}
async function render(){if(cur=="Home")return home();if(cur=="Create")return create();if(cur=="Production")return production();if(cur=="Projects")return projects();if(cur=="Brand")return brand();if(cur=="Publish")return publish();if(cur=="Analytics")return analytics();if(cur=="Agents")return agents();if(cur=="Operations")return operations();if(cur=="Quality & Gaps")return quality();if(cur=="System")return system();if(cur=="Chat")return chat();if(cur=="Notebook")return notebook();if(cur=="Engineering")return engineering();if(cur=="Turbo 60")return turbo60();return generic()}
async function home(){var d=await api("/infinity/3700/dashboard"),m=d.metrics||{};$("main").innerHTML='<div class="card hero"><div class="ey">DIRECTOR MODE · 3700</div><h1>One command. One operating workspace.</h1><p class="muted">Create, produce, organize, publish, analyze and execute from a single real backend.</p><div class="cmd"><textarea id="cmd" class="field area" placeholder="Describe the outcome you want..."></textarea><button class="btn primary" onclick="command()">Execute</button></div></div><div class="metrics">'+metric("Active opportunities",m.active_opportunities||0)+metric("Verified earnings","$"+Number(m.verified_earnings||0).toFixed(2))+metric("Pending funds","$"+Number(m.pending_verified_funds||0).toFixed(2))+metric("Transferable","$"+Number(m.transferable_balance||0).toFixed(2))+"</div>"+card("Projects",list(d.projects))+card("Live activity",list(d.activity));$("rail").innerHTML=card("Reality gate",'<div class="good">Truthful state reporting enabled.</div><p class="muted">External side effects remain authority-gated.</p>')+card("Opportunities",list(d.tasks))}
async function command(){var v=$("cmd").value.trim();if(!v)return;try{var r=await api("/infinity/3700/command",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({command:v,approved:false})});$("main").insertAdjacentHTML("afterbegin",card("Command result",'<pre class="out">'+esc(JSON.stringify(r,null,2))+"</pre>"))}catch(e){$("main").insertAdjacentHTML("afterbegin",card("Command error",'<div class="bad">'+esc(e.message)+"</div>"))}}
function create(){$("main").innerHTML='<div class="card hero"><div class="ey">CREATE</div><h1>Turn an objective into a real project.</h1><p class="muted">The project is persisted in AI Infinity rather than represented by placeholder cards.</p></div>'+card("New project",'<input id="pn" class="field" placeholder="Project name"><br><br><textarea id="po" class="field area" placeholder="Objective"></textarea><br><br><button class="btn primary" onclick="newProject()">Create project</button>');$("rail").innerHTML=card("Workflow","<b>Understand → Plan → Act → Verify → Done</b>")}
async function newProject(){var n=$("pn").value.trim(),o=$("po").value.trim();if(!o)return;var r=await api("/infinity/3700/projects",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:n,objective:o})});$("main").insertAdjacentHTML("afterbegin",card("Created",'<pre class="out">'+esc(JSON.stringify(r,null,2))+"</pre>"))}
async function projects(){var d=await api("/infinity/3700/projects");$("main").innerHTML='<div class="card hero"><div class="ey">PROJECTS</div><h1>Your operating portfolio.</h1></div>'+card("Projects",list(d.projects));$("rail").innerHTML=card("State","Projects are persisted and stage-aware.")}
async function production(){ $("main").innerHTML='<div class="card hero"><div class="ey">PRODUCTION</div><h1>Build a production package.</h1><p class="muted">Create through the existing media-production engine and persist the project.</p></div>'+card("Production brief",'<input id="pt" class="field" placeholder="Title"><br><br><textarea id="po2" class="field area" placeholder="Production objective"></textarea><br><br><button class="btn primary" onclick="makeProduction()">Create production</button>');$("rail").innerHTML=card("Reality","Production preparation is distinct from external publication.")}
async function makeProduction(){var r=await api("/infinity/3700/production",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({title:$("pt").value,objective:$("po2").value})});$("main").insertAdjacentHTML("afterbegin",card("Production result",'<pre class="out">'+esc(JSON.stringify(r,null,2))+"</pre>"))}
async function brand(){var d=await api("/infinity/3700/brand"),b=d.brand;$("main").innerHTML='<div class="card hero"><div class="ey">BRAND</div><h1>One persistent identity.</h1></div>'+card("Brand profile",'<input id="bn" class="field" value="'+esc(b.brand_name)+'"><br><br><input id="bv" class="field" value="'+esc(b.voice)+'"><br><br><textarea id="bp" class="field area">'+esc(b.positioning)+"</textarea><br><br><button class="btn primary" onclick="saveBrand()">Save brand</button>");$("rail").innerHTML=card("Direction","Premium, calm, futuristic and readable.")}
async function saveBrand(){var r=await api("/infinity/3700/brand",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({brand_name:$("bn").value,voice:$("bv").value,positioning:$("bp").value})});$("main").insertAdjacentHTML("afterbegin",card("Saved",'<pre class="out">'+esc(JSON.stringify(r,null,2))+"</pre>"))}
async function publish(){var d=await api("/infinity/3700/publish");$("main").innerHTML='<div class="card hero"><div class="ey">PUBLISH</div><h1>Prepare verified publication states.</h1><p class="muted">Draft-ready never masquerades as externally published.</p></div>'+card("New draft",'<input id="ptitle" class="field" placeholder="Title"><br><br><textarea id="pbody" class="field area" placeholder="Content"></textarea><br><br><button class="btn primary" onclick="draft()">Prepare draft</button>')+card("Queue",list(d.items));$("rail").innerHTML=card("Truth rule","External publication is only reported after destination confirmation.")}
async function draft(){var r=await api("/infinity/3700/publish",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({title:$("ptitle").value,body:$("pbody").value})});$("main").insertAdjacentHTML("afterbegin",card("Draft prepared",'<pre class="out">'+esc(JSON.stringify(r,null,2))+"</pre>"))}
async function analytics(){var d=await api("/infinity/3700/analytics");$("main").innerHTML='<div class="card hero"><div class="ey">ANALYTICS</div><h1>Real system metrics.</h1></div><div class="metrics">'+metric("Projects",d.projects.total)+metric("Active",d.projects.active)+metric("Verified","$"+Number(d.execution.verified_earnings||0).toFixed(2))+metric("Transferable","$"+Number(d.execution.transferable_balance||0).toFixed(2))+"</div>"+card("Execution economy",'<pre class="out">'+esc(JSON.stringify(d,null,2))+"</pre>");$("rail").innerHTML=card("Interpretation","Verified funds are separated from pending and transferable state.")}
async function agents(){var d=await api("/infinity/3700/agents");$("main").innerHTML='<div class="card hero"><div class="ey">AGENTS</div><h1>Coordinated specialist layer.</h1></div>'+card("Agent fleet",list(d.agents));$("rail").innerHTML=card("Organization",'<pre class="out">'+esc(JSON.stringify(d.organization||{},null,2))+"</pre>")}
async function operations(){var d=await api("/infinity/3700/operations");$("main").innerHTML='<div class="card hero"><div class="ey">OPERATIONS</div><h1>Operate with visible gates.</h1></div>'+card("Readiness",'<pre class="out">'+esc(JSON.stringify(d.readiness||{},null,2))+"</pre>")+card("Reality",'<pre class="out">'+esc(JSON.stringify(d.reality||{},null,2))+"</pre>");$("rail").innerHTML=card("Safety","Emergency stop available. Uncertain external replay disabled.")}
async function quality(){var d=await api("/infinity/3700/quality");$("main").innerHTML='<div class="card hero"><div class="ey">QUALITY & GAPS</div><h1 class="'+(d.regression&&d.regression.passed?"good":"warn")+'">'+(d.regression&&d.regression.passed?"Regression checks passed":"Attention required")+"</h1></div>"+card("Regression",'<pre class="out">'+esc(JSON.stringify(d,null,2))+"</pre>");$("rail").innerHTML=card("Truthfulness","Unconfigured external capabilities remain visibly gated.")}
async function system(){var d=await api("/infinity/3700/system");$("main").innerHTML='<div class="card hero"><div class="ey">SYSTEM</div><h1>'+esc(d.version)+'</h1><p class="muted">'+esc(d.build)+"</p></div>"+card("Runtime",'<pre class="out">'+esc(JSON.stringify(d,null,2))+"</pre>");$("rail").innerHTML=card("Platform","Free-first. No arbitrary code execution.")}
async function chat(){$("main").innerHTML='<div class="card hero"><div class="ey">CHAT</div><h1>Talk to the operating workspace.</h1></div>'+card("Conversation",'<div id="msgs" class="list"><div class="item">Ready. Tell AI Infinity what outcome you want.</div></div><br><textarea id="chat" class="field area" placeholder="Message AI Infinity..."></textarea><br><br><button class="btn primary" onclick="sendChat()">Send</button>');$("rail").innerHTML=card("Mode","Chat is connected to the existing final workspace.")}
async function sendChat(){var v=$("chat").value.trim();if(!v)return;$("msgs").insertAdjacentHTML("beforeend",'<div class="item">'+esc(v)+"</div>");$("chat").value="";try{var r=await api("/infinity/final/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:v})});$("msgs").insertAdjacentHTML("beforeend",'<div class="item">'+esc(r.response||r.message||JSON.stringify(r))+"</div>")}catch(e){$("msgs").insertAdjacentHTML("beforeend",'<div class="item bad">'+esc(e.message)+"</div>")}}

async function notebook(){var d=await api("/infinity/3701/knowledge/notebooks");$("main").innerHTML='<div class="card hero"><div class="ey">SOURCE-GROUNDED NOTEBOOK</div><h1>Research like a studio, not a blank chat.</h1><p class="muted">Add URLs or text, then ask questions with source-linked evidence. Build a briefing from the same evidence.</p></div>'+card("Create notebook",'<input id="npt" class="field" placeholder="Notebook title"><br><br><button class="btn primary" onclick="newNb()">Create notebook</button>')+card("Your notebooks",list(d.notebooks));$("rail").innerHTML=card("Grounding","Only saved notebook sources are eligible for grounded answers.")}
async function newNb(){var r=await api("/infinity/3701/knowledge/notebooks",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({title:$("npt").value})});var id=r.notebook.notebook_id;$("main").insertAdjacentHTML("afterbegin",card("Notebook ready",'<div class="good">'+esc(id)+'</div><br><input id="nsu" class="field" placeholder="Public HTTPS URL"><br><br><button class="btn" onclick="addUrl()">Add source</button><br><br><textarea id="nq" class="field area" placeholder="Ask a grounded question..."></textarea><br><br><button class="btn primary" onclick="askNb('+JSON.stringify(id)+')">Ask notebook</button>'))}
async function addUrl(){var id=prompt("Notebook ID");if(!id)return;try{var r=await api("/infinity/3701/knowledge/notebooks/"+encodeURIComponent(id)+"/sources",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({source_type:"url",url:$("nsu").value})});$("main").insertAdjacentHTML("afterbegin",card("Source added",'<pre class="out">'+esc(JSON.stringify(r,null,2))+"</pre>"))}catch(e){$("main").insertAdjacentHTML("afterbegin",card("Source error",'<div class="bad">'+esc(e.message)+"</div>"))}}
async function askNb(id){var q=$("nq").value.trim();if(!q)return;try{var r=await api("/infinity/3701/knowledge/query",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({notebook_id:id,query:q})});$("main").insertAdjacentHTML("afterbegin",card("Grounded answer",'<pre class="out">'+esc(JSON.stringify(r,null,2))+"</pre>"))}catch(e){$("main").insertAdjacentHTML("afterbegin",card("Notebook error",'<div class="bad">'+esc(e.message)+"</div>"))}}
async function engineering(){var d=await api("/infinity/3701/engineering/overview");$("main").innerHTML='<div class="card hero"><div class="ey">ENGINEERING CONTROL DECK</div><h1>GitHub-style work, inside AI Infinity.</h1><p class="muted">Repository intelligence, commits and delivery signals are visible beside creative production.</p></div>'+card("Repository",'<b>'+esc(d.repository)+'</b><br><span class="badge">'+(d.write_enabled?"write enabled":"read-only")+"</span>")+card("Recent commits",'<pre class="out">'+esc(JSON.stringify(d.commits||[],null,2))+"</pre>");$("rail").innerHTML=card("Capabilities","Code search · issues · review · Actions · activity · quality gates")}
async function turbo60(){$("main").innerHTML='<div class="card hero"><div class="ey">TURBO 60</div><h1>One hour of content, generated immediately.</h1><p class="muted">The structured 60-minute script, storyboard and captions are created in the request path. Real audio/video rendering continues in parallel so the interface never waits for the entire encode.</p></div>'+card("Build",'<input id="tt" class="field" value="AI Infinity flagship episode"><br><br><textarea id="to" class="field area" placeholder="What should this 60-minute episode accomplish?"></textarea><br><br><button class="btn primary" onclick="runTurbo()">Build 60-minute content</button>')+card("Reality","Immediate package = real script/storyboard/captions. Final MP4 = real background render, reported only when complete.");$("rail").innerHTML=card("Acceleration","Parallel local TTS + parallel clip normalization + stream-copy video mux in FAST_MODE.")}
async function runTurbo(){var o=$("to").value.trim();if(!o)return;try{var r=await api("/infinity/3701/turbo/compose",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({title:$("tt").value,objective:o,duration_seconds:3600})});$("main").insertAdjacentHTML("afterbegin",card("Turbo accepted",'<pre class="out">'+esc(JSON.stringify(r,null,2))+"</pre>"));pollTurbo(r.job_id)}catch(e){$("main").insertAdjacentHTML("afterbegin",card("Turbo error",'<div class="bad">'+esc(e.message)+"</div>"))}}
async function pollTurbo(id){for(var i=0;i<180;i++){await new Promise(function(r){setTimeout(r,2500)});try{var d=await api("/infinity/3701/turbo/"+encodeURIComponent(id));var j=d.job;var el=document.querySelector(".card");if(el){el.insertAdjacentHTML("afterend",card("Turbo status",'<div><b>'+esc(j.stage)+'</b> · '+Math.round(Number(j.progress||0)*100)+'%</div><div class="muted">'+esc(j.status)+"</div>"));}if(j.status=="completed"||j.status=="failed")break}catch(e){break}}}
function generic(){$("main").innerHTML='<div class="card hero"><div class="ey">INTELLIGENCE · ASSETS</div><h1>Connected workspace capability.</h1><p class="muted">Use the command surface or specialist tabs to operate the existing AI Infinity engines.</p></div>';$("rail").innerHTML=card("Available","Research, media, assets, execution, verification and economy remain connected through the underlying platform.")}
nav();api("/infinity/3700/health").then(function(){ $("live").textContent="● online";return render()}).catch(function(e){$("live").textContent="● error";$("main").innerHTML=card("AI Infinity startup error",'<div class="bad">'+esc(e.message)+"</div>")});
document.addEventListener("keydown",function(e){if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()=="k"){e.preventDefault();go("Home").then(function(){setTimeout(function(){$("cmd")&&$("cmd").focus()},50)})}});
</script></body></html>
