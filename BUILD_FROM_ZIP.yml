name: Build AI Infinity Android Bridge from uploaded bundle
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Find and extract bridge bundle
        shell: bash
        run: |
          set -e
          ZIP=$(find . -maxdepth 2 -type f -name 'AI-Infinity-Android-Bridge-COMPLETE.zip' -print -quit)
          test -n "$ZIP"
          rm -rf android-bridge
          unzip -q "$ZIP"
      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build release APK
        working-directory: android-bridge
        run: gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ai-infinity-bridge-apk
          path: android-bridge/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
