name: AI Infinity Free Wakeup

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - name: Wake AI Infinity with the canonical health endpoint
        env:
          AI_INFINITY_PUBLIC_URL: https://ai-infinity-ca5e.onrender.com
        run: |
          set -eu
          curl --fail --silent --show-error --retry 3 --max-time 45             -H "Cache-Control: no-cache"             "$AI_INFINITY_PUBLIC_URL/health" >/tmp/aii-health.json
          python - <<'PY'
          import json
          with open("/tmp/aii-health.json","r",encoding="utf-8") as f:
              data=json.load(f)
          if data.get("status") != "healthy":
              raise SystemExit("AI Infinity health check did not report healthy")
          print("AI Infinity healthy:", data.get("version"), data.get("build"))
          PY
