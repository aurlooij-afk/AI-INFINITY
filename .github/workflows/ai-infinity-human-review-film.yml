name: AI Infinity — One Idea Infinite Worlds Human Review Film

on:
  push:
    branches:
      - run/one-idea-infinite-worlds-review
    paths:
      - tests/review-film-trigger.txt
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ai-infinity-one-idea-human-review
  cancel-in-progress: true

jobs:
  create-review-film:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Check out the isolated review branch
        uses: actions/checkout@v4

      - name: Build the authoritative AI Infinity runtime
        run: docker build --pull -t ai-infinity-human-review .

      - name: Run duration and cinematic campaign regressions
        run: |
          set -euo pipefail
          for test_file in \
            tests/test_canonical_duration_precedence.py \
            tests/test_one_idea_infinite_worlds_plan.py \
            tests/test_one_idea_procedural_visuals.py \
            tests/test_one_idea_source_catalog.py \
            tests/test_concat_segments_normalization.py; do
            docker run --rm \
              -e AI_INFINITY_DATA_DIR=/tmp/ai-infinity-review-tests \
              -e AI_INFINITY_FAST_MODE=0 \
              -v "$GITHUB_WORKSPACE:/workspace:ro" \
              -w /workspace \
              --entrypoint python \
              ai-infinity-human-review "$test_file"
          done

      - name: Run the exact creative brief through the real Creator Studio
        id: create
        run: |
          set -uo pipefail
          mkdir -p "$GITHUB_WORKSPACE/creative-review-evidence"
          chmod 0777 "$GITHUB_WORKSPACE/creative-review-evidence"
          set +e
          docker run --rm --network host \
            -e CI=true \
            -e AI_INFINITY_FAST_MODE=0 \
            -e AI_INFINITY_VIDEO_PRESET=veryfast \
            -e AI_INFINITY_REVIEW_DATA_DIR=/tmp/ai-infinity-one-idea-review \
            -e AI_INFINITY_EVIDENCE_DIR=/evidence \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -v "$GITHUB_WORKSPACE/creative-review-evidence:/evidence" \
            -w /workspace \
            --entrypoint python \
            ai-infinity-human-review \
            tests/create_one_idea_infinite_worlds_review.py 2>&1 | tee "$GITHUB_WORKSPACE/creative-review-run.log"
          run_status=$?
          set -e
          echo "creator_exit_code=$run_status" >> "$GITHUB_OUTPUT"
          exit "$run_status"

      - name: Upload compact human-review video and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-infinity-one-idea-infinite-worlds-human-review
          path: |
            creative-review-evidence/AI-Infinity-One-Idea-Infinite-Worlds-60s.mp4
            creative-review-evidence/AI-Infinity-One-Idea-Infinite-Worlds-Review-Package.zip
            creative-review-evidence/production-summary.json
            creative-review-evidence/human-review-scorecard.json
            creative-review-evidence/intermediate-media-inventory.json
            creative-review-evidence/exact-creative-brief.md
            creative-review-run.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload original editable AI Infinity project package separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-infinity-one-idea-infinite-worlds-editable-project
          path: creative-review-evidence/editable-project-package.zip
          if-no-files-found: warn
          retention-days: 14