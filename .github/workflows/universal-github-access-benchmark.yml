name: AI Infinity — GitHub-Wide Autonomy Benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - "self_maintenance.py"
      - "ai_infinity_canonical.py"
      - "scripts/benchmark_github_access.py"
      - "tests/test_self_maintenance.py"
      - "tests/test_github_access_benchmark.py"
      - "tests/test_universal_command_router.py"
      - "docs/SELF_MAINTENANCE.md"
      - ".github/workflows/universal-github-access-benchmark.yml"

# The benchmark's repository writes use the dedicated owner token below.
# The workflow token is read-only and is used only for checkout/artifact transport.
permissions:
  contents: read
  actions: write

jobs:
  repository-access:
    name: Measure token-authorized GitHub-wide access
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the minimal self-maintenance runtime dependency
        run: python -m pip install --disable-pip-version-check fastapi pytest

      - name: Compile benchmark and repository executor
        run: python -m py_compile self_maintenance.py scripts/benchmark_github_access.py

      - name: Run GitHub-wide execution and self-maintenance regression tests
        run: python -m pytest -q tests/test_github_access_benchmark.py tests/test_self_maintenance.py tests/test_universal_command_router.py

      - name: Exercise GitHub REST, GraphQL, cross-repository access and self-maintenance
        env:
          AI_INFINITY_MAINTENANCE_GITHUB_TOKEN: ${{ secrets.AI_INFINITY_MAINTENANCE_GITHUB_TOKEN || secrets.AI_INFINITY_GITHUB_TOKEN }}
          AI_INFINITY_MAINTENANCE_GITHUB_TOKEN_SOURCE: ${{ secrets.AI_INFINITY_MAINTENANCE_GITHUB_TOKEN != '' && 'AI_INFINITY_MAINTENANCE_GITHUB_TOKEN' || secrets.AI_INFINITY_GITHUB_TOKEN != '' && 'AI_INFINITY_GITHUB_TOKEN' || 'missing_dedicated_owner_token' }}
          AI_INFINITY_MAINTENANCE_GITHUB_ACCESS_MODE: github_full
          GITHUB_REPOSITORY: ${{ github.repository }}
          AI_INFINITY_BENCHMARK_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python scripts/benchmark_github_access.py --output github-access-benchmark.json

      - name: Upload measured permission and performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-infinity-github-access-benchmark
          path: github-access-benchmark.json
          if-no-files-found: warn
          retention-days: 30
