# Canonical AI Infinity build guard.
name: Creator Studio Build Guard

on:
  push:
    branches: ["main"]
    paths:
      - "*.py"
      - "Dockerfile"
      - "requirements.txt"
      - "bridge-requirements.txt"
      - "ui_3700.html"
      - "runtime_main_3700.py"
      - "overlay_final_3700.py"
      - "production_hardening.py"
      - "ai_infinity_portable_fabric.py"
      - "production_worker.py"
      - "docker-compose.production.yml"
      - "Caddyfile"
      - "scripts/**"
      - ".github/workflows/creator-studio-ci.yml"
  pull_request:
    paths:
      - "*.py"
      - "Dockerfile"
      - "requirements.txt"
      - "bridge-requirements.txt"
      - "ui_3700.html"
      - "runtime_main_3700.py"
      - "overlay_final_3700.py"
      - ".github/workflows/creator-studio-ci.yml"

concurrency:
  group: ai-infinity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-syntax:
    name: Canonical runtime guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AI_INFINITY_DATA_DIR: /tmp/ai-infinity-build-guard
      AI_INFINITY_EXTERNAL_WORKER: "true"
      AI_INFINITY_STORAGE_MODE: local
      AI_INFINITY_PERSISTENCE_MODE: portable-volume
    steps:
      - uses: actions/checkout@v4

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Reproduce image bootstrap
        run: |
          cp main.py foundation.py

      - name: Compile runtime Python
        run: |
          set -euo pipefail
          python -m py_compile             main.py foundation.py studio_ultimate.py studio_os.py content_factory.py             free_api_fabric.py infinity_empire.py creator_os_3624.py ai_infinity_bridge.py             creator_entrypoint.py creator_pro_os.py ai3701_features.py ai3702_platform.py             ai3703_patch.py ai3704_storage_fabric.py ai3705_closure.py ai3706_internal_closure.py             overlay_final_3700.py runtime_main_3700.py production_hardening.py             ai_infinity_portable_fabric.py production_worker.py
          echo "Python syntax checks passed."

      - name: Parse canonical browser JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("ui_3700.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script[^>]*>([\s\S]*?)</script>", html, flags=re.I)
          if not scripts:
              raise SystemExit("No canonical UI script found")
          Path("/tmp/ai-infinity-ui.js").write_text("\n".join(scripts), encoding="utf-8")
          required = [
              "AI Infinity", "DIRECTOR MODE", "REAL CONTENT PRODUCTION",
              'function projects()', 'function assets()', 'function analytics()',
              "/infinity/studio/director", "/infinity/studio/project/",
              "Create real content"
          ]
          missing = [x for x in required if x not in html]
          if missing:
              raise SystemExit("Canonical UI contract missing: " + ", ".join(missing))
          if "TARGET-2050.3623" in html:
              raise SystemExit("Legacy 3623 UI marker leaked into canonical UI")
          PY
          node --check /tmp/ai-infinity-ui.js

      - name: Validate portable architecture
        run: |
          set -euo pipefail
          test -f docker-compose.production.yml
          test -f Caddyfile
          test -f .env.production.example
          test -f scripts/production_acceptance.py
          ! grep -RniE 'render\.com|RENDER_|render_required|render_knowledge|render\.yaml' --exclude-dir=.git --exclude='creator-studio-ci.yml' --exclude='production-studio-gate.yml' .
          python - <<'PY'
          import os
          import tempfile
          os.environ["AI_INFINITY_DATA_DIR"] = tempfile.mkdtemp(prefix="ai-infinity-contract-")
          os.environ["AI_INFINITY_EXTERNAL_WORKER"] = "true"
          import ai_infinity_portable_fabric as fabric
          contract = fabric.runtime_contract()
          assert contract["portable"] is True
          assert contract["hosting"] == "self_hosted_container_stack"
          assert contract["platform_dependencies"] == []
          assert contract["worker_contract"]["durable_queue"] is True
          assert contract["worker_contract"]["lease_recovery"] is True
          assert contract["worker_contract"]["checkpoint_resume"] is True
          print("Portable architecture PASS:", contract["version"], contract["build"])
          PY

      - name: Import canonical runtime
        run: |
          python - <<'PY'
          import os
          import tempfile
          os.environ["AI_INFINITY_DATA_DIR"] = tempfile.mkdtemp(prefix="ai-infinity-runtime-")
          os.environ["AI_INFINITY_EXTERNAL_WORKER"] = "true"
          import runtime_main_3700
          app = runtime_main_3700.app
          assert runtime_main_3700.foundation.app.state.ai_infinity_3708 is True
          contract = runtime_main_3700.foundation.app.state.portable_production_fabric
          assert contract["portable"] is True
          assert contract["hosting"] == "self_hosted_container_stack"
          print("Canonical runtime import PASS")

      - name: Verify canonical HTTP surface
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          import runtime_main_3700
          client = TestClient(runtime_main_3700.app)
          for path in ("/", "/health", "/infinity/3708/health", "/infinity/studio/production-fabric"):
              response = client.get(path)
              if response.status_code >= 500:
                  raise SystemExit(f"{path} returned HTTP {response.status_code}: {response.text[:500]}")
          root = client.get("/")
          if root.status_code != 200 or "AI Infinity" not in root.text or "REAL CONTENT PRODUCTION" not in root.text:
              raise SystemExit("Canonical AI Infinity root failed")
          if root.headers.get("x-ai-infinity-ui") != "3708-portable-production":
              raise SystemExit("Canonical 3708 UI header missing: " + str(dict(root.headers)))
          print("Canonical HTTP surface PASS")
          PY

  docker-build:
    name: Docker image guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: python-syntax
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --pull --tag ai-infinity:ci .
      - name: Validate Compose file
        run: docker compose -f docker-compose.production.yml config
