# Canonical production gate: every push validates the deployed creator_entrypoint and real media execution.
name: Creator Studio Build Guard

on:
  push:
    branches: ["main"]
    paths:
      - "*.py"
      - "Dockerfile"
      - "requirements.txt"
      - "bridge-requirements.txt"
      - "creator_studio_2030.html"
      - ".github/workflows/creator-studio-ci.yml"
  pull_request:
    paths:
      - "*.py"
      - "Dockerfile"
      - "requirements.txt"
      - "bridge-requirements.txt"
      - ".github/workflows/creator-studio-ci.yml"

permissions:
  contents: read

jobs:
  python-syntax:
    name: Python syntax guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile all runtime Python modules
        run: |
          set -euo pipefail
          python -m py_compile main.py studio_ultimate.py studio_os.py content_factory.py free_api_fabric.py infinity_empire.py creator_os_3624.py ai_infinity_bridge.py creator_entrypoint.py creator_pro_os.py
          echo "Python syntax checks passed."
      - name: Parse Creator Studio browser JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path("creator_studio_2030.html").read_text(encoding="utf-8")
          scripts=re.findall(r"<script[^>]*>([\s\S]*?)</script>", html, flags=re.I)
          Path("/tmp/creator-studio.js").write_text("\n".join(scripts),encoding="utf-8")
          if not scripts:
              raise SystemExit("No Creator Studio script found")
          print("Extracted", len(scripts), "browser script block(s).")
          PY
          node --check /tmp/creator-studio.js
      - name: Instantiate and smoke-test the unified app
        env:
          AI_INFINITY_STUDIO_SMOKE: "1"
          AI_INFINITY_DATA_DIR: "/tmp/ai-infinity-ci-smoke"
          AI_INFINITY_FAST_MODE: "1"
        run: |
          set -euo pipefail
          python - <<'PY'
          import main
          import creator_entrypoint
          from fastapi.testclient import TestClient

          # Render production uses creator_entrypoint:application, exactly as Docker CMD.
          import creator_entrypoint
          from fastapi.testclient import TestClient

          production_paths = {getattr(route, "path", "") for route in creator_entrypoint.creator_app.routes}
          required = {
              "/", "/health", "/infinity/studio", "/infinity/studio/health",
              "/infinity/studio/bootstrap", "/infinity/studio/tools",
              "/infinity/studio/projects", "/infinity/studio/workspace/export",
              "/infinity/studio/workspace/backup", "/infinity/studio/creator-pro",
              "/infinity/studio/open-source",
              "/infinity/studio/project/{project_id}/storyboard/apply",
              "/infinity/studio/project/{project_id}/transcript/clip",
          }
          missing = sorted(required - production_paths)
          if missing:
              raise SystemExit("Production creator app is missing routes: " + ", ".join(missing))

          client = TestClient(creator_entrypoint.application)
          for path in ("/", "/health", "/infinity/studio", "/infinity/studio/health",
                       "/infinity/studio/bootstrap", "/infinity/studio/tools",
                       "/infinity/studio/projects", "/infinity/studio/workspace/export",
                       "/infinity/studio/workspace/backup"):
              response = client.get(path) if path != "/infinity/studio/workspace/backup" else client.post(path)
              if response.status_code >= 500:
                  raise SystemExit(f"{path} returned HTTP {response.status_code}: {response.text[:500]}")
              if path != "/" and response.status_code == 404:
                  raise SystemExit(f"{path} is unexpectedly 404 in production creator app")

          root = client.get("/")
          if "AI Infinity" not in root.text:
              raise SystemExit("Unified root page does not contain AI Infinity")

          import time

          smoke = client.post("/infinity/studio/project", json={
              "title": "CI Creator Smoke",
              "objective": "Create a tiny useful explainer about renewable energy.",
              "topic": "renewable energy",
              "format": "short",
              "duration": 20,
              "content_type": "video",
              "language": "English",
              "aspect_ratio": "9:16",
          })
          if smoke.status_code not in (200,201):
              raise SystemExit(f"Create project failed: HTTP {smoke.status_code}: {smoke.text[:1000]}")
          project_id = (smoke.json() or {}).get("project_id")
          if not project_id:
              raise SystemExit("Create project did not return project_id")
          deadline = time.time() + 150
          final = None
          while time.time() < deadline:
              current = client.get("/infinity/studio/project/" + project_id)
              if current.status_code >= 500:
                  raise SystemExit(f"Project status failed: HTTP {current.status_code}: {current.text[:1000]}")
              final = current.json()
              if final.get("status") in {"completed","completed_with_qc_warnings","failed","cancelled"}:
                  break
              time.sleep(1)
          if not final:
              raise SystemExit("No project status returned")
          if final.get("status") not in {"completed","completed_with_qc_warnings"}:
              raise SystemExit("Real creator smoke production did not complete: " + str(final)[:4000])
          required_artifacts = ["final.mp4","captions.srt","script.md","thumbnail.jpg","manifest.json","sources.json","audio_master.mp3"]
          for name in required_artifacts:
              check = client.get("/infinity/studio/project/" + project_id + "/asset/" + name)
              if check.status_code != 200:
                  raise SystemExit(f"Artifact {name} unavailable: HTTP {check.status_code}: {check.text[:500]}")
          board = client.get("/infinity/studio/project/" + project_id + "/storyboard")
          if board.status_code != 200 or not (board.json().get("scenes") or []):
              raise SystemExit("Storyboard was not generated from the real project")

          pro = client.get("/infinity/studio/creator-pro")
          if pro.status_code != 200 or not pro.json().get("editor",{}).get("color"):
              raise SystemExit("Creator Pro capability surface is unavailable")

          edit = client.post("/infinity/studio/project/" + project_id + "/edit/advanced", json={
              "trim_start": 0, "trim_end": 0, "speed": 1, "aspect_ratio": "9:16",
              "brightness": 0, "contrast": 1, "saturation": 1, "sharpness": 0
          })
          if edit.status_code != 200:
              raise SystemExit(f"Advanced video edit failed: HTTP {edit.status_code}: {edit.text[:1200]}")

          clip = client.post("/infinity/studio/project/" + project_id + "/transcript/clip", json={
              "start": 0.2, "end": 1.5
          })
          if clip.status_code != 200:
              raise SystemExit(f"Transcript clip failed: HTTP {clip.status_code}: {clip.text[:1200]}")

          interactive = client.post("/infinity/studio/project/" + project_id + "/interactive", json={
              "title": "CI interactive", "headline": "Renewable energy", "body": "A self-contained creator experience."
          })
          if interactive.status_code != 200:
              raise SystemExit(f"Interactive export failed: HTTP {interactive.status_code}: {interactive.text[:1200]}")

          image = client.post("/infinity/studio/project/" + project_id + "/image/edit", json={
              "source_asset_name": "thumbnail.jpg", "scale": 1, "brightness": 1.05,
              "contrast": 1.05, "saturation": 1.05, "sharpness": 1.1
          })
          if image.status_code != 200:
              raise SystemExit(f"Image Lab failed: HTTP {image.status_code}: {image.text[:1200]}")

          matrix = client.post("/infinity/studio/project/" + project_id + "/variant-matrix", json={"ratios":["9:16"]})
          if matrix.status_code != 200 or not (matrix.json().get("variants") or []):
              raise SystemExit(f"Variant build failed: HTTP {matrix.status_code}: {matrix.text[:1200]}")

          scenes = board.json().get("scenes") or []
          saved = client.put("/infinity/studio/project/" + project_id + "/storyboard", json={"title":"CI storyboard","scenes":scenes})
          if saved.status_code != 200:
              raise SystemExit(f"Storyboard save failed: HTTP {saved.status_code}: {saved.text[:1000]}")

          print("End-to-end creator + Creator Pro smoke production passed:", project_id)
          print("Production main:app + creator dispatcher smoke test passed.")
          PY

  docker-build:
    name: Docker image guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: python-syntax
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --pull --tag ai-infinity:ci .
