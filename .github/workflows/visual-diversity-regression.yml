name: Visual Diversity Truth Regression

on:
  push:
    branches:
      - fix/visual-diversity-scene-count
    paths:
      - production_closure_3624.py
      - tests/test_visual_diversity_truth.py
      - .github/workflows/visual-diversity-regression.yml

permissions:
  contents: read

jobs:
  focused-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused test dependencies
        run: python -m pip install "pytest>=8,<9" fastapi
      - name: Run visual-diversity regression tests
        run: python -m pytest -q tests/test_visual_diversity_truth.py
