name: AI Infinity — Live Render Verification

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Only one real live-production workload may exercise the free Render service at a time.
  # These groups intentionally match across both live smoke workflows.
  group: ai-infinity-live-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-render-smoke:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for Render deployment and verify live creator surface
        env:
          BASE_URL: https://ai-infinity-ca5e.onrender.com
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, sys, time, urllib.request
          base=os.environ["BASE_URL"].rstrip("/")
          paths=["/health","/infinity/divine/health","/infinity/pro2/health","/infinity/pro2"]
          last={}
          stable=0
          stable_instance=""
          for attempt in range(1, 61):
              ok=True
              last={}
              observed_instance=""
              for path in paths:
                  try:
                      with urllib.request.urlopen(base+path, timeout=12) as r:
                          body=r.read()
                          if r.status != 200 or not body:
                              raise RuntimeError(f"{path}: HTTP {r.status}")
                          if path.endswith("/health"):
                              data=json.loads(body.decode("utf-8"))
                              if not isinstance(data, dict) or str(data.get("status","")).lower() not in {"healthy","degraded"}:
                                  raise RuntimeError(f"{path}: invalid health payload {data}")
                              observed_instance=str(data.get("instance_id") or "")
                          elif path.endswith("/pro2/health"):
                              data=json.loads(body.decode("utf-8"))
                              if not isinstance(data, dict) or "providers" not in data:
                                  raise RuntimeError(f"{path}: missing provider state")
                  except Exception as exc:
                      ok=False
                      last[path]=str(exc)
              if ok and observed_instance:
                  stable = stable + 1 if observed_instance == stable_instance else 1
                  stable_instance = observed_instance
              else:
                  stable=0
                  stable_instance=""
              print(f"attempt={attempt} ok={ok} instance={observed_instance or 'unknown'} consecutive={stable} failures={last}")
              if ok and stable >= 6:
                  sys.exit(0)
              time.sleep(5)
          raise SystemExit(f"live Render verification failed or never stabilized: {last}")
          PY

      - name: Run a real deployed creator production
        env:
          BASE_URL: https://ai-infinity-ca5e.onrender.com
        run: |
          set -euo pipefail
          python - <<'PY'
          import io, json, os, time, urllib.request, urllib.parse, urllib.error
          import http.cookiejar, zipfile, hashlib, subprocess
          base=os.environ["BASE_URL"].rstrip("/")
          cmd="Create a 20-second English cinematic video using only local/free execution, with voiceover, captions, thumbnail and a real final package."
          jar=http.cookiejar.CookieJar()
          opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))

          req=urllib.request.Request(
              base+"/infinity/canonical/create",
              data=json.dumps({"command":cmd,"duration":20,"format":"short","aspect_ratio":"9:16"}).encode(),
              headers={"Content-Type":"application/json"},
              method="POST",
          )
          with opener.open(req,timeout=60) as r:
              payload=json.loads(r.read().decode("utf-8"))
              if r.status != 200:
                  raise SystemExit(f"create failed: HTTP {r.status}: {payload}")

          pid=str(payload.get("project_id") or "")
          if not pid:
              raise SystemExit(f"deployed creator did not return project_id: {payload}")
          print("LIVE_PROJECT",pid)

          deadline=time.time()+600
          while time.time()<deadline:
              with opener.open(base+"/infinity/studio/project/"+urllib.parse.quote(pid,safe=""),timeout=60) as r:
                  state=json.loads(r.read().decode("utf-8"))
              status=str(state.get("status") or "").lower()
              print("LIVE_STATE",json.dumps({k:state.get(k) for k in ("project_id","status","state","runtime_state","stage","progress","error")},ensure_ascii=False))
              if status in {"completed","failed","cancelled","completed_with_qc_warnings"}:
                  if status != "completed" or str(state.get("state") or "").upper()!="COMPLETED":
                      raise SystemExit("deployed real production did not reach verified COMPLETED state")

                  pid_q=urllib.parse.quote(pid,safe="")
                  with opener.open(base+"/infinity/studio/project/"+pid_q+"/artifacts",timeout=60) as r:
                      artifacts=json.loads(r.read().decode("utf-8"))

                  names={}
                  for a in artifacts.get("artifacts",[]):
                      n=str(a.get("asset_name") or a.get("name") or "")
                      if n:
                          names[n]=a

                  required=[
                      "final.mp4","thumbnail.jpg","audio_master.mp3","captions.srt",
                      "article.md","seo.json","social_campaign.json",
                      "production_manifest.json","rights_manifest.json","package.zip"
                  ]
                  missing=sorted(set(required)-set(names))
                  if missing:
                      raise SystemExit(f"deployed production missing artifacts: {missing}")

                  work={}
                  for name in required:
                      with opener.open(
                          base+"/infinity/studio/project/"+pid_q+"/asset/"+urllib.parse.quote(name,safe=""),
                          timeout=120
                      ) as r:
                          data=r.read()
                      if not data:
                          raise SystemExit(f"deployed production returned zero bytes for {name}")
                      work[name]=data
                      print("LIVE_ARTIFACT",name,len(data))

                  video_path="/tmp/ai-infinity-live-final.mp4"
                  with open(video_path,"wb") as f:
                      f.write(work["final.mp4"])
                  probe=subprocess.run(
                      ["ffprobe","-v","error","-show_format","-show_streams","-of","json",video_path],
                      capture_output=True,text=True,timeout=120
                  )
                  if probe.returncode != 0:
                      raise SystemExit(f"ffprobe failed: {probe.stderr}")
                  media=json.loads(probe.stdout)
                  streams=media.get("streams",[])
                  if not any(s.get("codec_type")=="video" for s in streams):
                      raise SystemExit("final.mp4 has no video stream")
                  if not any(s.get("codec_type")=="audio" for s in streams):
                      raise SystemExit("final.mp4 has no audio stream")

                  with zipfile.ZipFile(io.BytesIO(work["package.zip"])) as z:
                      packaged=set(z.namelist())
                  package_required=(set(required)-{"package.zip"}) | {"provenance.json"}
                  missing_package=sorted(package_required-packaged)
                  if missing_package:
                      raise SystemExit(f"package.zip missing entries: {missing_package}")

                  print("LIVE_ARTIFACT_SET",json.dumps(required))
                  print("LIVE_FFPROBE_OK",json.dumps({"streams":len(streams),"duration":media.get("format",{}).get("duration")}))
                  print("LIVE_PACKAGE_OK",json.dumps(sorted(package_required)))
                  sys.exit(0)

              time.sleep(4)

          raise SystemExit("deployed real production timed out")
          PY
