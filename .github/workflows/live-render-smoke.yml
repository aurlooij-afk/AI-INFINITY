name: AI Infinity — Live Render Verification

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Only one real live-production workload may exercise the free Render service at a time.
  # These groups intentionally match across both live smoke workflows.
  group: ai-infinity-live-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-render-smoke:
    if: github.ref_name == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Wait for Render deployment and verify live creator surface
        env:
          BASE_URL: https://ai-infinity-ca5e.onrender.com
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, sys, time, urllib.request
          base=os.environ["BASE_URL"].rstrip("/")
          expected_revision=os.environ["EXPECTED_REVISION"]
          paths=["/health","/infinity/divine/health","/infinity/pro2/health","/infinity/pro2","/infinity/storage/v1/status"]
          last={}
          # The canonical /health response is authoritative for deployment identity.
          # Later health endpoints are allowed to be healthy without repeating that
          # identity, but MUST NOT overwrite a valid canonical observation.
          def retain_first_identity(current, candidate):
              return current or candidate
          
          # Focused regression: a later health payload with no identity must preserve
          # the canonical observation; a genuinely missing identity must stay missing.
          assert retain_first_identity("", "REAL_INSTANCE") == "REAL_INSTANCE"
          assert retain_first_identity("REAL_INSTANCE", "") == "REAL_INSTANCE"
          assert retain_first_identity("REAL_INSTANCE", "OTHER_INSTANCE") == "REAL_INSTANCE"
          assert retain_first_identity("", "") == ""
          
          stable=0
          stable_revision=""
          for attempt in range(1, 61):
              ok=True
              last={}
              observed_revision=""
              for path in paths:
                  try:
                      with urllib.request.urlopen(base+path, timeout=12) as r:
                          body=r.read()
                          if r.status != 200 or not body:
                              raise RuntimeError(f"{path}: HTTP {r.status}")
                          if path.endswith("/health"):
                              data=json.loads(body.decode("utf-8"))
                              if not isinstance(data, dict) or str(data.get("status","")).lower() not in {"healthy","degraded"}:
                                  raise RuntimeError(f"{path}: invalid health payload {data}")
                              candidate_revision=str(data.get("deployment_revision") or data.get("revision") or data.get("git_sha") or data.get("commit") or "")
                              observed_revision=retain_first_identity(observed_revision, candidate_revision)
                          elif path.endswith("/pro2/health"):
                              data=json.loads(body.decode("utf-8"))
                              if not isinstance(data, dict) or "providers" not in data:
                                  raise RuntimeError(f"{path}: missing provider state")
                          elif path == "/infinity/storage/v1/status":
                              data=json.loads(body.decode("utf-8"))
                              if not isinstance(data, dict) or data.get("truthful") is not True or not isinstance(data.get("providers"), list):
                                  raise RuntimeError(f"{path}: invalid storage status payload")
                  except Exception as exc:
                      ok=False
                      last[path]=str(exc)
              if ok and observed_revision == expected_revision:
                  stable = stable + 1 if observed_revision == stable_revision else 1
                  stable_revision = observed_revision
              else:
                  stable=0
                  stable_revision=""
              print(f"attempt={attempt} ok={ok} expected={expected_revision} revision={observed_revision or 'unknown'} consecutive={stable} failures={last}")
              if ok and observed_revision == expected_revision and stable >= 6:
                  # Render may still be completing the final old-instance shutdown immediately
                  # after the exact revision becomes observable. Give the deployment 60s to
                  # settle before creating a stateful live project.
                  print("exact revision stable; waiting for rollout settlement",flush=True)
                  time.sleep(60)
                  sys.exit(0)
              time.sleep(5)
          raise SystemExit(f"live Render verification failed or never stabilized: {last}")
          PY

      - name: Set up pinned static FFmpeg and FFprobe
        uses: AnimMouse/setup-ffmpeg@178e0b4a408f06ce40d896c3cd79f50fa6f8b0c3
        with:
          version: release
      - name: Verify FFmpeg and FFprobe
        run: |
          set -euo pipefail
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Verify FFmpeg and FFprobe
        run: |
          set -euo pipefail
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Run a real deployed creator production
        env:
          BASE_URL: https://ai-infinity-ca5e.onrender.com
        run: |
          set -euo pipefail
          python - <<'PY'
          import io, json, os, sys, time, urllib.request, urllib.parse, urllib.error
          import http.cookiejar, zipfile, hashlib, subprocess
          base=os.environ["BASE_URL"].rstrip("/")
          cmd="Create a 20-second English cinematic documentary about Earth from space using relevant NASA or public-domain visuals, with voiceover, readable captions, thumbnail and a complete creator package. Use free-first execution; do not use paid providers."
          jar=http.cookiejar.CookieJar()
          opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))

          req=urllib.request.Request(
              base+"/infinity/canonical/create",
              data=json.dumps({"command":cmd,"duration":20,"format":"short","aspect_ratio":"16:9"}).encode(),
              headers={"Content-Type":"application/json"},
              method="POST",
          )
          with opener.open(req,timeout=60) as r:
              payload=json.loads(r.read().decode("utf-8"))
              if r.status != 200:
                  raise SystemExit(f"create failed: HTTP {r.status}: {payload}")

          pid=str(payload.get("project_id") or "")
          if not pid:
              raise SystemExit(f"deployed creator did not return project_id: {payload}")
          print("LIVE_PROJECT",pid)

          deadline=time.time()+600
          while time.time()<deadline:
              with opener.open(base+"/infinity/studio/project/"+urllib.parse.quote(pid,safe=""),timeout=60) as r:
                  state=json.loads(r.read().decode("utf-8"))
              status=str(state.get("status") or "").lower()
              print("LIVE_STATE",json.dumps({k:state.get(k) for k in ("project_id","status","state","runtime_state","stage","progress","error")},ensure_ascii=False))
              if status in {"completed","failed","cancelled","completed_with_qc_warnings"}:
                  if status != "completed" or str(state.get("state") or "").upper()!="COMPLETED":
                      raise SystemExit("deployed real production did not reach verified COMPLETED state")

                  pid_q=urllib.parse.quote(pid,safe="")
                  with opener.open(base+"/infinity/studio/project/"+pid_q+"/artifacts",timeout=60) as r:
                      artifacts=json.loads(r.read().decode("utf-8"))

                  names={}
                  for a in artifacts.get("artifacts",[]):
                      n=str(a.get("asset_name") or a.get("name") or "")
                      if n:
                          names[n]=a

                  required=[
                      "final.mp4","thumbnail.jpg","audio_master.mp3","captions.srt",
                      "article.md","seo.json","social_campaign.json",
                      "production_manifest.json","rights_manifest.json","package.zip"
                  ]
                  missing=sorted(set(required)-set(names))
                  if missing:
                      raise SystemExit(f"deployed production missing artifacts: {missing}")

                  work={}
                  for name in required:
                      with opener.open(
                          base+"/infinity/studio/project/"+pid_q+"/asset/"+urllib.parse.quote(name,safe=""),
                          timeout=120
                      ) as r:
                          data=r.read()
                      if not data:
                          raise SystemExit(f"deployed production returned zero bytes for {name}")
                      work[name]=data
                      print("LIVE_ARTIFACT",name,len(data))

                  video_path="/tmp/ai-infinity-live-final.mp4"
                  with open(video_path,"wb") as f:
                      f.write(work["final.mp4"])
                  probe=subprocess.run(
                      ["ffprobe","-v","error","-show_format","-show_streams","-of","json",video_path],
                      capture_output=True,text=True,timeout=120
                  )
                  if probe.returncode != 0:
                      raise SystemExit(f"ffprobe failed: {probe.stderr}")
                  media=json.loads(probe.stdout)
                  streams=media.get("streams",[])
                  video=next((s for s in streams if s.get("codec_type")=="video"),None)
                  audio=next((s for s in streams if s.get("codec_type")=="audio"),None)
                  if not video:
                      raise SystemExit("final.mp4 has no video stream")
                  if not audio:
                      raise SystemExit("final.mp4 has no audio stream")
                  duration=float((media.get("format") or {}).get("duration") or 0)
                  if duration <= 0 or abs(duration-20.0) > 1.0:
                      raise SystemExit(f"final.mp4 duration mismatch: expected 20s ±1s, got {duration}")

                  # ffprobe validates container metadata; ffmpeg decode proves every packet
                  # is readable and catches truncated/corrupt frames and audio packets.
                  decoded=subprocess.run(
                      ["ffmpeg","-v","error","-xerror","-i",video_path,"-f","null","-"],
                      capture_output=True,text=True,timeout=180
                  )
                  if decoded.returncode != 0:
                      raise SystemExit(f"full media decode failed: {decoded.stderr[:3000]}")

                  with zipfile.ZipFile(io.BytesIO(work["package.zip"])) as z:
                      packaged=set(z.namelist())
                  package_required=(set(required)-{"package.zip"}) | {"provenance.json"}
                  missing_package=sorted(package_required-packaged)
                  if missing_package:
                      raise SystemExit(f"package.zip missing entries: {missing_package}")

                  # Snapshot verification is asynchronous by design: project
                  # completion can race the final SQLite checkpoint to object
                  # storage. Poll the real health endpoint until the current
                  # snapshot is PUT/HEAD/GET/SHA-verified; never accept a stale
                  # or merely configured backend.
                  durability_deadline = time.time() + 60
                  durable_evidence = {}
                  last_health_error = None
                  while time.time() < durability_deadline:
                      try:
                          with urllib.request.urlopen(base + "/health", timeout=20) as health_response:
                              health = json.loads(health_response.read().decode("utf-8"))
                          capabilities = health.get("capabilities") if isinstance(health, dict) else {}
                          storage_state = capabilities.get("storage") if isinstance(capabilities, dict) else {}
                          storage_state = storage_state if isinstance(storage_state, dict) else {}
                          backend_state = storage_state.get("project_state_backend_status")
                          backend_state = backend_state if isinstance(backend_state, dict) else {}
                          durable_evidence = {
                              "persistent": storage_state.get("persistent") is True,
                              "mode": storage_state.get("mode"),
                              "reason": storage_state.get("reason"),
                              "backend": backend_state.get("backend"),
                              "configured": backend_state.get("configured") is True,
                              "active": backend_state.get("active") is True,
                              "verified": backend_state.get("verified") is True,
                              "snapshot_verified": backend_state.get("snapshot_verified") is True,
                              "last_sync_present": bool(backend_state.get("last_sync_at")),
                              "sha256_present": bool(backend_state.get("last_sha256")),
                              "last_error_kind": str(backend_state.get("last_error") or "").split(":", 1)[0] or None,
                          }
                          print("LIVE_PROJECT_STATE_DURABILITY_ATTEMPT", json.dumps(durable_evidence, sort_keys=True), flush=True)
                          if durable_evidence["persistent"] is True:
                              if durable_evidence["reason"] == "verified_durable_state_backend":
                                  required_state = (
                                      "configured", "active", "verified", "snapshot_verified",
                                      "last_sync_present", "sha256_present",
                                  )
                                  missing_state = [key for key in required_state if not durable_evidence[key]]
                                  if not missing_state:
                                      break
                              elif durable_evidence["reason"] == "actual_persistent_mount_confirmed":
                                  break
                      except Exception as exc:
                          last_health_error = type(exc).__name__ + ": " + str(exc)[:300]
                          print("LIVE_PROJECT_STATE_HEALTH_RETRY", last_health_error, flush=True)
                      time.sleep(2)
                  else:
                      raise SystemExit(
                          "live project-state persistence did not become verified within 60s: "
                          + json.dumps(durable_evidence, sort_keys=True)
                          + ("; last_health_error=" + last_health_error if last_health_error else "")
                      )
                  if durable_evidence.get("persistent") is not True:
                      raise SystemExit("live project-state persistence truth is not persistent")


                  print("LIVE_ARTIFACT_SET",json.dumps(required))
                  print("LIVE_FFPROBE_OK",json.dumps({"streams":len(streams),"duration":media.get("format",{}).get("duration")}))
                  print("LIVE_PACKAGE_OK",json.dumps(sorted(package_required)))
                  sys.exit(0)

              time.sleep(4)

          # Capture the last real server truth and storage state before failing. These
          # diagnostics do not turn a timed-out production into a pass.
          print("LIVE_TIMEOUT_LAST_STATE", json.dumps(state, ensure_ascii=False, default=str))
          for diagnostic_path in (
              "/infinity/studio/project/" + urllib.parse.quote(pid, safe="") + "/truth",
              "/infinity/studio/project/" + urllib.parse.quote(pid, safe="") + "/artifacts",
              "/infinity/storage/v1/status",
          ):
              try:
                  with opener.open(base + diagnostic_path, timeout=20) as r:
                      payload = r.read(200_000).decode("utf-8", "replace")
                  print("LIVE_TIMEOUT_DIAGNOSTIC", diagnostic_path, payload[:12000])
              except Exception as exc:
                  print("LIVE_TIMEOUT_DIAGNOSTIC_FAILED", diagnostic_path, type(exc).__name__, str(exc)[:800])
          raise SystemExit("deployed real production timed out; diagnostic truth captured above")
          PY
