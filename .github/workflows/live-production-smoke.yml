name: AI Infinity — Live Production Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Only one real live-production workload may exercise the free Render service at a time.
  # These groups intentionally match across both live smoke workflows.
  group: ai-infinity-live-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-smoke:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          command -v ffmpeg
          command -v ffprobe
      - name: Wait for live deployment
        env:
          BASE_URL: https://ai-infinity-ca5e.onrender.com
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os,time,urllib.request,json
          base=os.environ["BASE_URL"].rstrip("/")
          expected=os.environ["EXPECTED_REVISION"]
          deadline=time.time()+600
          # Prove exact revision stability without depending on an instance_id
          # field that the live health endpoint does not guarantee.
          stable=0
          stable_revision=""
          while time.time()<deadline:
              try:
                  with urllib.request.urlopen(base+"/infinity/canonical/health",timeout=20) as r:
                      body=r.read().decode("utf-8","replace")
                      print(body[:4000],flush=True)
                      if r.status==200:
                          try:
                              data=json.loads(body)
                          except Exception:
                              data={}
                          revision=str(data.get("deployment_revision") or data.get("revision") or data.get("git_sha") or data.get("commit") or "")
                          if revision == expected:
                              stable = stable + 1 if revision == stable_revision else 1
                              stable_revision = revision
                              print("live revision candidate: expected=%s revision=%s consecutive=%s" % (expected, revision, stable),flush=True)
                              if stable >= 6:
                                  # Let the new Render instance finish rollout and old-instance
                                  # shutdown before the live test creates persistent project state.
                                  print("exact revision stable; waiting for rollout settlement",flush=True)
                                  time.sleep(60)
                                  raise SystemExit(0)
                          else:
                              stable=0
                              stable_revision=""
                              print("healthy deployment is not current/stable: expected=%s actual=%s" % (expected, revision or "unknown"),flush=True)
              except SystemExit:
                  raise
              except Exception as e:
                  stable=0
                  stable_revision=""
                  print("waiting:",e,flush=True)
              time.sleep(5)
          raise SystemExit("canonical Render deployment did not become live and stable at the configured Render URL")
          PY
      - name: Run real live creator E2E
        env:
          BASE_URL: https://ai-infinity-ca5e.onrender.com
          EXPECTED_REVISION: ${{ github.sha }}
        run: python tests/live_creator_smoke.py
      - name: Capture live creator artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-infinity-live-creator-proof-${{ github.sha }}
          path: |
            /tmp/live-ai-infinity/*.mp4
            /tmp/live-ai-infinity/*.json
          if-no-files-found: ignore
          retention-days: 7
