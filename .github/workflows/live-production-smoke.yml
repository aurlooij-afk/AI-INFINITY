name: AI Infinity — Live Production Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Wait for live deployment
        env:
          BASE_URL: https://ai-infinity-ca5e.onrender.com
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os,time,urllib.request,json
          base=os.environ["BASE_URL"].rstrip("/")
          expected=os.environ["EXPECTED_REVISION"]
          deadline=time.time()+600
          while time.time()<deadline:
              try:
                  with urllib.request.urlopen(base+"/infinity/canonical/health",timeout=20) as r:
                      body=r.read().decode("utf-8","replace")
                      print(body[:4000],flush=True)
                      if r.status==200:
                          try:
                              data=json.loads(body)
                          except Exception:
                              data={}
                          revision=str(data.get("deployment_revision") or data.get("revision") or data.get("git_sha") or data.get("commit") or "")
                          if revision == expected:
                              raise SystemExit(0)
                          print("healthy deployment is not current: expected=%s actual=%s" % (expected, revision or "unknown"),flush=True)
              except Exception as e:
                  print("waiting:",e,flush=True)
              time.sleep(10)
          raise SystemExit("canonical Render deployment did not become live at the configured Render URL")
          PY
      - name: Run real live creator E2E
        env:
          BASE_URL: https://ai-infinity-ca5e.onrender.com
          EXPECTED_REVISION: ${{ github.sha }}
        run: python tests/live_creator_smoke.py
      - name: Capture live creator artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-infinity-live-creator-proof-${{ github.sha }}
          path: |
            /tmp/live-ai-infinity/*.mp4
            /tmp/live-ai-infinity/*.json
          if-no-files-found: ignore
          retention-days: 7
