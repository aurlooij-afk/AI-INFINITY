name: AI Infinity Wakeup

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read

concurrency:
  group: ai-infinity-wakeup
  cancel-in-progress: true

jobs:
  wake:
    name: Wake and verify AI Infinity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AI_INFINITY_PUBLIC_URL: https://ai-infinity-ca5e.onrender.com
    steps:
      - name: Wake and verify
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="${AI_INFINITY_PUBLIC_URL%/}"
          curl --fail --silent --show-error --location --retry 4 --retry-delay 5 --retry-all-errors --connect-timeout 15 --max-time 90 "${BASE_URL}/health" -o /tmp/health.json
          test -s /tmp/health.json
          python - <<'PY'
          import json
          with open("/tmp/health.json","r",encoding="utf-8") as f:
              data=json.load(f)
          if data.get("status") != "healthy":
              raise SystemExit("AI Infinity health is not healthy")
          print("AI Infinity healthy:", data.get("version"), data.get("build"))
          PY
          curl --fail --silent --show-error --location --retry 3 --retry-delay 3 --retry-all-errors --connect-timeout 15 --max-time 60 "${BASE_URL}/infinity/studio" -o /tmp/studio.html
          test -s /tmp/studio.html
          echo "Creator Studio reachable."
