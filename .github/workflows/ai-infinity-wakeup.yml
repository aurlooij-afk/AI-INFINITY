name: AI Infinity Wakeup

on:
  workflow_dispatch:

  schedule:
    # Keep the public Render service periodically active.
    # GitHub may delay scheduled jobs slightly.
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: ai-infinity-wakeup
  cancel-in-progress: true

jobs:
  wake:
    name: Wake and verify AI Infinity
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      AI_INFINITY_PUBLIC_URL: https://ai-infinity-ca5e.onrender.com

    steps:
      - name: Wake public website
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="${AI_INFINITY_PUBLIC_URL%/}"

          echo "=============================================="
          echo "AI Infinity Wakeup"
          echo "Target: ${BASE_URL}"
          echo "=============================================="

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 4 \
            --retry-delay 5 \
            --retry-all-errors \
            --connect-timeout 15 \
            --max-time 90 \
            "${BASE_URL}/" \
            -o /tmp/ai-infinity-home.html

          test -s /tmp/ai-infinity-home.html

          echo "Homepage reachable."

      - name: Verify application health
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="${AI_INFINITY_PUBLIC_URL%/}"

          echo "Checking AI Infinity studio health..."

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 4 \
            --retry-delay 5 \
            --retry-all-errors \
            --connect-timeout 15 \
            --max-time 90 \
            "${BASE_URL}/infinity/studio/health" \
            -o /tmp/ai-infinity-health.json

          test -s /tmp/ai-infinity-health.json

          echo "Health response:"
          cat /tmp/ai-infinity-health.json
          echo
          echo "AI Infinity health endpoint responded successfully."

      - name: Verify Creator Studio
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="${AI_INFINITY_PUBLIC_URL%/}"

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 3 \
            --retry-delay 3 \
            --retry-all-errors \
            --connect-timeout 15 \
            --max-time 60 \
            "${BASE_URL}/studio" \
            -o /tmp/ai-infinity-studio.html

          test -s /tmp/ai-infinity-studio.html

          echo "Creator Studio is reachable."

      - name: Wakeup summary
        if: always()
        shell: bash
        run: |
          echo "AI Infinity wakeup workflow completed."
          echo "Scheduled wake interval: every 15 minutes."
          echo "Manual execution is available through workflow_dispatch."
