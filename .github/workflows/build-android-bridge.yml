name: Build AI Infinity Connect APK

on:
workflow_dispatch:
push:
paths:
- "android-bridge/**"
- ".github/workflows/build-android-bridge.yml"

permissions:
contents: read

jobs:
build:
name: Build AI-Infinity-Connect.apk
runs-on: ubuntu-latest

defaults:
  run:
    working-directory: android-bridge

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Install Android SDK components
    run: |
      sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: "8.9"

  - name: Build release APK
    run: gradle :app:assembleRelease --no-daemon --stacktrace

  - name: Rename APK
    run: |
      mkdir -p build-output
      cp app/build/outputs/apk/release/app-release.apk build-output/AI-Infinity-Connect.apk

  - name: Upload ONLY AI-Infinity-Connect.apk
    uses: actions/upload-artifact@v4
    with:
      name: AI-Infinity-Connect.apk
      path: android-bridge/build-output/AI-Infinity-Connect.apk
      if-no-files-found: error
      retention-days: 30
