name: AI Infinity — Divine Closure Proof

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  syntax-and-closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile runtime surface
        run: |
          python -m py_compile             main.py             divine_closure_3900.py             studio_ultimate.py             creator_final_3800.py             creator_pro_os.py             production_hardening.py             free_api_fabric.py             ai3701_features.py             ai3702_platform.py             ai3703_patch.py             ai3704_storage_fabric.py             ai3705_closure.py             ai3706_internal_closure.py
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify production fallback contract
        run: |
          python -m pytest -q tests/test_production_fallback.py

      - name: Verify canonical creator boundary is wired
        run: |
          set -euo pipefail
          grep -q 'ai_infinity_canonical.py' Dockerfile
          grep -q 'ai_infinity_app.py' Dockerfile
          grep -Eq 'CMD uvicorn (main|ai_infinity_app):app' Dockerfile
          test -f entrypoint.sh
          sh -n entrypoint.sh
          grep -Fq 'ENTRYPOINT ["/bin/sh","/app/entrypoint.sh"]' Dockerfile
          grep -q 'main.py' Dockerfile
          grep -q 'production_openai_video.py' Dockerfile
          grep -q 'reality_first_3901.py' Dockerfile
          python - <<'PY'
          import ai_infinity_canonical as c
          assert c.VERSION == "AI-INFINITY-CANONICAL-1.0"
          assert c.SCHEMA == "ai-infinity-canonical-v1"
          import main
          assert callable(main.app)
          print("canonical-boundary-ok")
          PY