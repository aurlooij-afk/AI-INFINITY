name: AI Infinity — GitHub-Native Execution Proof

on:
  push:
    branches:
      - ai-infinity/github-native-execution-proof
    paths:
      - ".github/workflows/github-native-execution-proof.yml"
      - "scripts/github_native_execution_proof.py"
      - "ai_infinity/**"
      - "ai_infinity_canonical.py"
      - "universal_command_batch.py"
      - "main.py"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-infinity-github-native-proof-${{ github.ref }}
  cancel-in-progress: false

jobs:
  execute:
    name: Execute real application commands on GitHub-hosted runner
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
      AI_INFINITY_FAST_MODE: "1"
      AI_INFINITY_3601_BACKGROUND: "false"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout exact workflow commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install the actual application runtime dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          if [ -s bridge-requirements.txt ]; then
            python -m pip install -r bridge-requirements.txt
          fi

      - name: Compile execution core and proof harness
        run: |
          set -euo pipefail
          python -m py_compile \
            main.py \
            ai_infinity_canonical.py \
            ai_infinity/execution_core.py \
            universal_command_batch.py \
            scripts/github_native_execution_proof.py

      - name: Run real execution-core and command-batch regression tests
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_execution_core.py \
            tests/test_universal_command_batch.py \
            tests/test_universal_command_router.py

      - name: Execute actual application, ledger, idempotency, batch DAG and GitHub API proof
        run: python scripts/github_native_execution_proof.py

      - name: Run consent-gated real Gemini inference check
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.AI_INFINITY_GEMINI_API_KEY || secrets.GOOGLE_AI_STUDIO_API_KEY || secrets.GOOGLE_API_KEY || secrets.GEMINI_KEY || secrets.AI_STUDIO_API_KEY }}
          AI_INFINITY_GEMINI_FREE_TIER_AND_DATA_USE_ACK: ${{ vars.AI_INFINITY_GEMINI_FREE_TIER_AND_DATA_USE_ACK || secrets.AI_INFINITY_GEMINI_FREE_TIER_AND_DATA_USE_ACK || vars.GEMINI_FREE_TIER_DATA_USE_ACK || secrets.GEMINI_FREE_TIER_DATA_USE_ACK || vars.GOOGLE_AI_STUDIO_FREE_TIER_ACK || secrets.GOOGLE_AI_STUDIO_FREE_TIER_ACK }}
          AI_INFINITY_GEMINI_FREE_TIER_MODEL: gemini-3.1-flash-lite
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path

          out = Path("github-native-evidence/model-inference-verification.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          key_present = bool(os.getenv("GEMINI_API_KEY", "").strip())
          ack = os.getenv("AI_INFINITY_GEMINI_FREE_TIER_AND_DATA_USE_ACK", "").strip().lower()
          if not key_present:
              result = {"status": "BLOCKED", "reason": "GEMINI_API_KEY_missing", "truthful": True}
          elif ack not in {"1", "true", "yes", "on"}:
              result = {"status": "BLOCKED", "reason": "explicit_Gemini_Free_Tier_data_use_acknowledgement_missing", "truthful": True}
          else:
              raw = Path("/tmp/ai-infinity-gemini-verification.json")
              completed = subprocess.run(
                  [sys.executable, "scripts/verify_gemini_writer.py", "--output", str(raw)],
                  check=False,
              )
              if raw.is_file():
                  full = json.loads(raw.read_text(encoding="utf-8"))
                  allowed = (
                      "status", "reason", "model", "http_status", "finish_reason",
                      "response_characters", "response_sha256", "truthful",
                  )
                  result = {name: full[name] for name in allowed if name in full}
                  result["verifier_exit_code"] = completed.returncode
              else:
                  result = {
                      "status": "FAIL",
                      "reason": "Gemini verifier did not produce evidence",
                      "verifier_exit_code": completed.returncode,
                      "truthful": True,
                  }
          out.write_text(json.dumps(result, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          print("GEMINI_INFERENCE_GATE=" + str(result.get("status", "UNKNOWN")))
          PY

      - name: Finalize evidence hashes
        if: always()
        run: |
          if [ -f github-native-evidence/execution-proof.json ]; then
            python scripts/github_native_execution_proof.py --finalize
          else
            echo "Execution proof report missing; no PASS artifact will be fabricated."
          fi

      - name: Upload exact-commit execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-infinity-github-native-execution-proof
          path: github-native-evidence/
          if-no-files-found: error
          retention-days: 14

  verify-handoff:
    name: Verify evidence on an independent fresh runner
    needs: execute
    if: needs.execute.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Download evidence from the execution runner
        uses: actions/download-artifact@v4
        with:
          name: ai-infinity-github-native-execution-proof
          path: github-native-evidence

      - name: Verify manifest, file hashes and exact source revision independently
        env:
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          root = Path("github-native-evidence")
          manifest = json.loads((root / "artifact-manifest.json").read_text(encoding="utf-8"))
          report = json.loads((root / "execution-proof.json").read_text(encoding="utf-8"))
          assert manifest.get("truthful") is True
          assert manifest.get("repository") == os.environ["EXPECTED_REPOSITORY"]
          assert manifest.get("commit_sha") == os.environ["EXPECTED_COMMIT_SHA"]
          assert manifest.get("workflow_run_id") == os.environ["EXPECTED_RUN_ID"]
          assert report.get("status") == "PASS"
          assert report.get("commit_sha") == os.environ["EXPECTED_COMMIT_SHA"]
          assert report.get("workflow_run_id") == os.environ["EXPECTED_RUN_ID"]
          assert report.get("github_api", {}).get("status") == "PASS"
          assert report.get("real_application_execution", {}).get("status") == "PASS"
          batch = report["real_application_execution"]["multi_command_batch"]
          assert batch.get("status") == "completed" and batch.get("completed_steps") == 2
          model = report.get("model_inference_gate", {})
          assert model.get("status") in {"PASS", "BLOCKED", "FAIL", "NOT_RUN"}

          for name, expected in manifest.get("files", {}).items():
              path = root / name
              assert path.is_file(), f"evidence file missing: {name}"
              payload = path.read_bytes()
              assert len(payload) == expected["size_bytes"], f"size mismatch: {name}"
              assert hashlib.sha256(payload).hexdigest() == expected["sha256"], f"hash mismatch: {name}"

          print("INDEPENDENT_RUNNER_ARTIFACT_READBACK=PASS")
          print("EXACT_COMMIT_BINDING=PASS")
          print("GITHUB_NATIVE_EXECUTION_EVIDENCE=PASS")
          print("GEMINI_INFERENCE_GATE=" + str(model.get("status")))
          print("NOTE: This proves cross-job artifact transfer and integrity, not permanent project storage.")
          PY
