name: AI Infinity — Final Complete Acceptance Suite

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-infinity-final-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  final-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build authoritative Docker runtime
        run: docker build --pull -t ai-infinity-final-acceptance .

      - name: Verify real Gemini Free Tier writer response
        id: gemini_writer
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_INFINITY_GEMINI_FREE_TIER_AND_DATA_USE_ACK: ${{ vars.AI_INFINITY_GEMINI_FREE_TIER_AND_DATA_USE_ACK }}
          AI_INFINITY_GEMINI_FREE_TIER_MODEL: gemini-3.1-flash-lite
        run: |
          set -euo pipefail
          if [[ -z "${GEMINI_API_KEY:-}" ]]; then
            echo "::error::GitHub Actions repository secret GEMINI_API_KEY is missing or empty. Add it under Settings > Secrets and variables > Actions > Repository secrets."
            exit 1
          fi
          case "${AI_INFINITY_GEMINI_FREE_TIER_AND_DATA_USE_ACK,,}" in
            true|1|yes|on) ;;
            *)
              echo "::error::Set the repository Actions variable AI_INFINITY_GEMINI_FREE_TIER_AND_DATA_USE_ACK to the exact value true only after accepting Google's Gemini Free Tier data-use terms."
              exit 1
              ;;
          esac
          mkdir -p "${GITHUB_WORKSPACE}/acceptance-evidence"
          chmod 0777 "${GITHUB_WORKSPACE}/acceptance-evidence"
          docker run --rm --network host \
            -e GEMINI_API_KEY \
            -e AI_INFINITY_GEMINI_FREE_TIER_AND_DATA_USE_ACK \
            -e AI_INFINITY_GEMINI_FREE_TIER_MODEL \
            -v "${GITHUB_WORKSPACE}:/workspace:ro" \
            -v "${GITHUB_WORKSPACE}/acceptance-evidence:/evidence" \
            -w /workspace --entrypoint python ai-infinity-final-acceptance \
            scripts/verify_gemini_writer.py --output /evidence/gemini-writer-verification.json

      - name: Verify live object-store snapshot round-trip and fresh-process restore
        id: project_state_storage
        continue-on-error: true
        env:
          AI_INFINITY_PROJECT_STATE_BACKEND: ${{ vars.AI_INFINITY_PROJECT_STATE_BACKEND || 'backblaze_b2' }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_REGION: ${{ secrets.B2_REGION }}
          BACKBLAZE_B2_ENDPOINT: ${{ secrets.BACKBLAZE_B2_ENDPOINT }}
          BACKBLAZE_B2_BUCKET: ${{ secrets.BACKBLAZE_B2_BUCKET }}
          BACKBLAZE_B2_KEY_ID: ${{ secrets.BACKBLAZE_B2_KEY_ID }}
          BACKBLAZE_B2_APPLICATION_KEY: ${{ secrets.BACKBLAZE_B2_APPLICATION_KEY }}
          BACKBLAZE_B2_REGION: ${{ secrets.BACKBLAZE_B2_REGION }}
          SUPABASE_S3_ENDPOINT: ${{ secrets.SUPABASE_S3_ENDPOINT }}
          SUPABASE_S3_BUCKET: ${{ secrets.SUPABASE_S3_BUCKET }}
          SUPABASE_S3_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
          SUPABASE_S3_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
          SUPABASE_S3_REGION: ${{ secrets.SUPABASE_S3_REGION }}
          SUPABASE_STORAGE_BUCKET: ${{ secrets.SUPABASE_STORAGE_BUCKET }}
        run: |
          set +e
          mkdir -p "${GITHUB_WORKSPACE}/acceptance-evidence"
          chmod 0777 "${GITHUB_WORKSPACE}/acceptance-evidence"
          docker run --rm --network host \
            -e AI_INFINITY_PROJECT_STATE_BACKEND \
            -e B2_ENDPOINT -e B2_BUCKET -e B2_KEY_ID -e B2_APPLICATION_KEY -e B2_REGION \
            -e BACKBLAZE_B2_ENDPOINT -e BACKBLAZE_B2_BUCKET -e BACKBLAZE_B2_KEY_ID \
            -e BACKBLAZE_B2_APPLICATION_KEY -e BACKBLAZE_B2_REGION \
            -e SUPABASE_S3_ENDPOINT -e SUPABASE_S3_BUCKET -e SUPABASE_S3_ACCESS_KEY_ID \
            -e SUPABASE_S3_SECRET_ACCESS_KEY -e SUPABASE_S3_REGION -e SUPABASE_STORAGE_BUCKET \
            -e AI_INFINITY_PERSISTENCE_MODE=durable \
            -e AI_INFINITY_PROJECT_STATE_DURABLE=true \
            -v "${GITHUB_WORKSPACE}:/workspace:ro" \
            -v "${GITHUB_WORKSPACE}/acceptance-evidence:/evidence" \
            -w /workspace --entrypoint python ai-infinity-final-acceptance \
            scripts/verify_live_project_state_storage.py --output /evidence/project-state-storage-verification.json
          storage_status=$?
          if [ "$storage_status" -eq 3 ]; then
            echo "PROJECT_STATE_STORAGE_GATE=BLOCKED — selected backend credentials are not configured."
            exit 0
          fi
          if [ "$storage_status" -ne 0 ]; then
            echo "PROJECT_STATE_STORAGE_GATE=FAIL — object-store round-trip or fresh-process restore failed."
            exit "$storage_status"
          fi
          echo "PROJECT_STATE_STORAGE_GATE=PASS"

      - name: Verify live authenticated Wan2.2 GPU inference (explicit owner acknowledgement)
        id: wan_live_inference
        continue-on-error: true
        env:
          AI_INFINITY_WAN_WORKER_URL: ${{ secrets.AI_INFINITY_WAN_WORKER_URL }}
          AI_INFINITY_WAN_WORKER_TOKEN: ${{ secrets.AI_INFINITY_WAN_WORKER_TOKEN }}
          AI_INFINITY_WAN_LIVE_INFERENCE_ACK: ${{ vars.AI_INFINITY_WAN_LIVE_INFERENCE_ACK }}
        run: |
          set +e
          docker run --rm --network host \
            -e AI_INFINITY_WAN_WORKER_URL \
            -e AI_INFINITY_WAN_WORKER_TOKEN \
            -e AI_INFINITY_WAN_LIVE_INFERENCE_ACK \
            -v "${GITHUB_WORKSPACE}:/workspace:ro" \
            -v "${GITHUB_WORKSPACE}/acceptance-evidence:/evidence" \
            -w /workspace --entrypoint python ai-infinity-final-acceptance \
            scripts/verify_live_wan_worker.py --output /evidence/wan-live-inference-verification.json
          inference_status=$?
          if [ "$inference_status" -eq 3 ]; then
            echo "WAN_GPU_INFERENCE_GATE=BLOCKED — worker not configured or explicit GPU usage acknowledgement missing."
            exit 0
          fi
          if [ "$inference_status" -ne 0 ]; then
            echo "WAN_GPU_INFERENCE_GATE=FAIL — authenticated inference or independent artifact verification failed."
            exit "$inference_status"
          fi
          echo "WAN_GPU_INFERENCE_GATE=PASS"

      - name: Run 13-scenario real acceptance suite (20s baseline, 60s flagship, 900s long-form; 720p/1080p)
        env:
          CI: "true"
          AI_INFINITY_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          AI_INFINITY_WORKFLOW_RUN_ID: ${{ github.run_id }}
          AI_INFINITY_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_INFINITY_GEMINI_FREE_TIER_AND_DATA_USE_ACK: ${{ vars.AI_INFINITY_GEMINI_FREE_TIER_AND_DATA_USE_ACK }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          AI_INFINITY_HF_FREE_TIER_AND_DATA_USE_ACK: ${{ vars.AI_INFINITY_HF_FREE_TIER_AND_DATA_USE_ACK }}
          AI_INFINITY_TEXT_MODEL: ${{ vars.AI_INFINITY_TEXT_MODEL }}
          AI_INFINITY_HF_PROVIDER: ${{ vars.AI_INFINITY_HF_PROVIDER }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AI_INFINITY_OPENROUTER_FREE_TIER_AND_DATA_USE_ACK: ${{ vars.AI_INFINITY_OPENROUTER_FREE_TIER_AND_DATA_USE_ACK }}
          AI_INFINITY_OPENROUTER_FREE_MODEL: ${{ vars.AI_INFINITY_OPENROUTER_FREE_MODEL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_STORAGE_BUCKET: ${{ secrets.SUPABASE_STORAGE_BUCKET }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AI_INFINITY_STORAGE_PRIMARY: ${{ vars.AI_INFINITY_STORAGE_PRIMARY }}
        run: |
          set -uo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/acceptance-evidence"
          # The production image runs as UID 10001; only this disposable CI evidence mount is made writable.
          chmod 0777 "${GITHUB_WORKSPACE}/acceptance-evidence"
          set +e
          docker run --rm --network host \
            -e CI \
            -e AI_INFINITY_SOURCE_REVISION \
            -e AI_INFINITY_WORKFLOW_RUN_ID \
            -e AI_INFINITY_WORKFLOW_RUN_ATTEMPT \
            -e GEMINI_API_KEY \
            -e AI_INFINITY_GEMINI_FREE_TIER_AND_DATA_USE_ACK \
            -e HF_TOKEN \
            -e AI_INFINITY_HF_FREE_TIER_AND_DATA_USE_ACK \
            -e AI_INFINITY_TEXT_MODEL \
            -e AI_INFINITY_HF_PROVIDER \
            -e OPENROUTER_API_KEY \
            -e AI_INFINITY_OPENROUTER_FREE_TIER_AND_DATA_USE_ACK \
            -e AI_INFINITY_OPENROUTER_FREE_MODEL \
            -e SUPABASE_URL -e SUPABASE_STORAGE_BUCKET -e SUPABASE_SERVICE_ROLE_KEY \
            -e AI_INFINITY_STORAGE_PRIMARY \
            -e AI_INFINITY_GEMINI_FREE_TIER_MODEL=gemini-3.1-flash-lite \
            -e AI_INFINITY_EVIDENCE_DIR=/evidence \
            -v "${GITHUB_WORKSPACE}:/workspace:ro" \
            -v "${GITHUB_WORKSPACE}/acceptance-evidence:/evidence" \
            -w /workspace \
            --entrypoint python \
            ai-infinity-final-acceptance \
            tests/final_acceptance_suite.py 2>&1 | tee acceptance-output.log
          suite_status=${PIPESTATUS[0]}
          set -e
          python - "$suite_status" <<'PY'
          import json
          import sys
          from pathlib import Path

          exit_code = int(sys.argv[1])
          source = Path("acceptance-evidence/final-acceptance-result.json")
          destination = Path("final-acceptance-result.json")
          if source.is_file():
              result = json.loads(source.read_text(encoding="utf-8"))
          else:
              result = {
                  "schema": "ai-infinity-final-acceptance-result.v2",
                  "overall_status": "FAIL",
                  "passed": False,
                  "runner_exit_code": exit_code,
                  "error": "The acceptance runner did not persist its structured scenario result.",
                  "diagnostics": "See acceptance-output.log and acceptance-evidence artifacts.",
                  "tests": [],
              }
          result["runner_exit_code"] = exit_code
          destination.write_text(json.dumps(result, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print("ACCEPTANCE_RESULT_STATUS=" + str(result.get("overall_status")))
          print("ACCEPTANCE_SCENARIOS_COMPLETED=" + str(result.get("completed_scenarios")))
          PY
          exit "$suite_status"
      - name: Write candidate-bound production certificate
        if: always()
        run: |
          python scripts/create_production_certificate.py \
            --candidate-sha "${{ github.event.pull_request.head.sha || github.sha }}" \
            --acceptance final-acceptance-result.json \
            --gemini-writer acceptance-evidence/gemini-writer-verification.json \
            --storage acceptance-evidence/project-state-storage-verification.json \
            --inference acceptance-evidence/wan-live-inference-verification.json \
            --deployment acceptance-evidence/live-deployment-verification.json \
            --human-approval acceptance-evidence/human-creative-approval.json \
            --output production-certificate.json

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-infinity-final-acceptance-evidence
          path: |
            final-acceptance-result.json
            production-certificate.json
            acceptance-evidence/**
          if-no-files-found: warn

      - name: Enforce candidate-bound production certificate
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("production-certificate.json")
          if not path.is_file():
              raise SystemExit("Production certificate was not generated.")
          certificate = json.loads(path.read_text(encoding="utf-8"))
          print("PRODUCTION_RELEASE_GATE=" + str(certificate.get("PRODUCTION_VERIFIED")))
          if certificate.get("PRODUCTION_VERIFIED") != "PASS":
              print("BLOCKED_GATES=" + json.dumps(certificate.get("remaining_blockers", [])))
              raise SystemExit("Production certification requires every gate to pass.")
          PY
      - name: Dump Docker/runtime evidence on failure
        if: failure()
        run: |
          echo "Repository SHA: ${GITHUB_SHA}"
          echo "Acceptance suite failed. The authoritative Docker runtime output above is the source of truth."
