name: AI Infinity — Final Complete Acceptance Suite

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-infinity-final-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  final-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build authoritative Docker runtime
        run: docker build --pull -t ai-infinity-final-acceptance .

      - name: Run ten-scenario real acceptance suite
        env:
          CI: "true"
        run: |
          set -o pipefail
          docker run --rm --network host             -e CI             -v "${GITHUB_WORKSPACE}:/workspace:ro"             -w /workspace             --entrypoint python             ai-infinity-final-acceptance             tests/final_acceptance_suite.py | tee final-acceptance-result.json

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-infinity-final-acceptance-evidence
          path: |
            final-acceptance-result.json
          if-no-files-found: warn

      - name: Dump Docker/runtime evidence on failure
        if: failure()
        run: |
          echo "Repository SHA: ${GITHUB_SHA}"
          echo "Acceptance suite failed. The authoritative Docker runtime output above is the source of truth."
