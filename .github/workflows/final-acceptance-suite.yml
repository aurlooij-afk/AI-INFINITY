name: AI Infinity — Final Complete Acceptance Suite

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-infinity-final-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  final-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build authoritative Docker runtime
        run: docker build --pull -t ai-infinity-final-acceptance .

      - name: Run 12-scenario real acceptance suite (20s/60s/180s and 720p/1080p)
        env:
          CI: "true"
        run: |
          set -uo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/acceptance-evidence"
          # The production image runs as UID 10001; only this disposable CI evidence mount is made writable.
          chmod 0777 "${GITHUB_WORKSPACE}/acceptance-evidence"
          set +e
          docker run --rm --network host \
            -e CI \
            -e AI_INFINITY_EVIDENCE_DIR=/evidence \
            -v "${GITHUB_WORKSPACE}:/workspace:ro" \
            -v "${GITHUB_WORKSPACE}/acceptance-evidence:/evidence" \
            -w /workspace \
            --entrypoint python \
            ai-infinity-final-acceptance \
            tests/final_acceptance_suite.py 2>&1 | tee acceptance-output.log
          suite_status=${PIPESTATUS[0]}
          set -e
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          raw = Path("acceptance-output.log").read_text(encoding="utf-8", errors="replace")
          decoder = json.JSONDecoder()
          result = None
          for match in reversed(list(re.finditer(r"(?m)^\s*\{", raw))):
              try:
                  value, _ = decoder.raw_decode(raw[match.start():])
              except Exception:
                  continue
              if isinstance(value, dict) and isinstance(value.get("tests"), list) and "passed" in value:
                  result = value
                  break
          if result is None:
              result = {
                  "passed": False,
                  "error": "The runtime did not emit a complete 12-scenario JSON result.",
                  "evidence_source": "Workflow logs contain diagnostics; no structured result was parsed.",
              }
          Path("final-acceptance-result.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          exit "$suite_status"

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-infinity-final-acceptance-evidence
          path: |
            final-acceptance-result.json
            acceptance-evidence/**
          if-no-files-found: warn

      - name: Dump Docker/runtime evidence on failure
        if: failure()
        run: |
          echo "Repository SHA: ${GITHUB_SHA}"
          echo "Acceptance suite failed. The authoritative Docker runtime output above is the source of truth."
