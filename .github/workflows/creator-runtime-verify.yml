          assert all(proof_checks.values()), {"proof_checks": proof_checks, "reality": reality}
          names={x["asset_name"] for x in json.load(open("/tmp/artifacts.json")).get("artifacts",[])}
          required={"final.mp4","captions.srt","thumbnail.jpg","manifest.json","script.md"}
          missing=required-names
          assert not missing, {"missing":sorted(missing),"names":sorted(names)}
          project=json.load(open("/tmp/project.json"))
          result=project.get("result") or {}
          quality=result.get("quality") or {}
          assert result.get("truthful") is True
          assert quality.get("passed") is True, quality
          print("REAL_CREATOR_PRODUCTION_SMOKE_PASS", project.get("project_id"))
          PY

          curl -fsS -c /tmp/cookies.txt -b /tmp/cookies.txt \
            "http://127.0.0.1:10000/infinity/studio/project/$PROJECT_ID/asset/final.mp4" -o /tmp/final.mp4
          curl -fsS -c /tmp/cookies.txt -b /tmp/cookies.txt \
            "http://127.0.0.1:10000/infinity/studio/project/$PROJECT_ID/asset/thumbnail.jpg" -o /tmp/thumbnail.jpg
          mkdir -p /tmp/ai-infinity-brand-film-review
          cp /tmp/final.mp4 /tmp/ai-infinity-brand-film-review/final.mp4
          cp /tmp/thumbnail.jpg /tmp/ai-infinity-brand-film-review/thumbnail.jpg
          for name in audio_master.mp3 narration_only.mp3 captions.srt script.md sources.json manifest.json production_manifest.json rights_manifest.json visual_rights.json provenance.json package.zip timeline.otio; do
