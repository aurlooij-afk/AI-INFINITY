                 "bundle_size_bytes":bundle_path.stat().st_size,"human_review_status":response.get("human_review_status"),
                 "truthful":True}
          Path("/tmp/otio-review-export-proof.json").write_text(json.dumps(proof,indent=2)+"\n")
          print("OTIO_BUNDLE_CRC_TIMELINE_SCENE_HASHES_AND_AUDIO_PASS",json.dumps(proof,sort_keys=True))
          PY
          curl -fsS -c /tmp/cookies.txt -b /tmp/cookies.txt \
            -H 'content-type: application/vnd.opentimelineio+json' --data-binary @/tmp/review-project.otio \
