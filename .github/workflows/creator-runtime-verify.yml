              "human_review_status": response.get("human_review_status"),
              "timeline_sha256": response["timeline"]["sha256"],
              "bundle_sha256": response["bundle"]["sha256"],
              "bundle_size_bytes": response["bundle"]["size_bytes"],
              "acceptance_pass": False
