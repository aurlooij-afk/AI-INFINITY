          Path("/tmp/otio-review-export-proof.json").write_text(json.dumps(proof, indent=2) + "\n", encoding="utf-8")
          print("OTIO_REVIEW_EXPORT_AND_RELOAD_SUBGATE_PASS", json.dumps(proof, sort_keys=True))
          PY
          fi

          if [ "$review_only" = "true" ]; then
