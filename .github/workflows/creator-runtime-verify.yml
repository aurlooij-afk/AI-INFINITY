          open("/tmp/otio-import-proof.json","w").write(json.dumps({
              "status":"PASS_OTIO_API_IMPORT_RELOAD","project_id":pid,"scene_count":len(rows),
              "render_required":x.get("render_required"),"truth_verified":x.get("truth_verified"),
