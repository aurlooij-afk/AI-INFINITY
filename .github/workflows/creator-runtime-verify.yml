name: AI Infinity Standalone Runtime Verification

on:
  push:
    branches: [main, ai-infinity-canonical-divine, feat/api-anything-research-connector]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-infinity-standalone-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up pinned static FFmpeg and FFprobe
        uses: AnimMouse/setup-ffmpeg@178e0b4a408f06ce40d896c3cd79f50fa6f8b0c3
        with:
          version: release
      - name: Verify FFmpeg and FFprobe
        run: |
          set -euo pipefail
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1


      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          if [ -s bridge-requirements.txt ]; then python -m pip install -r bridge-requirements.txt; fi

      - name: Verify standalone source
        env:
          AI_INFINITY_DATA_DIR: /tmp/ai-infinity-ci
          AI_INFINITY_3601_BACKGROUND: "false"
          AI_INFINITY_FAST_MODE: "1"
        run: |
          set -euo pipefail
          python -m py_compile main.py professional_creator_v2.py professional_creator_v2_timeline_patch.py professional_creator_fabric.py production_closure_3624.py studio_ultimate.py
          python - <<'PY'
          import os
          os.environ["AI_INFINITY_DATA_DIR"] = "/tmp/ai-infinity-ci"
          os.environ["AI_INFINITY_3601_BACKGROUND"] = "false"
          os.environ["AI_INFINITY_FAST_MODE"] = "1"
          import main
          from fastapi.testclient import TestClient
          client = TestClient(main.app)
          r = client.get("/health")
          assert r.status_code == 200, r.text
          root_health = r.json()
          assert root_health.get("status") in {"healthy", "degraded"}, r.text
          if root_health.get("status") == "degraded":
              # This host intentionally has no media binaries; the packaged Docker
              # runtime is the authoritative media environment tested below.
              caps = root_health.get("capabilities", {}).get("local", {})
              assert caps.get("media_core") is False, r.text
          r = client.get("/infinity/canonical/health")
          assert r.status_code == 200, r.text
          h = r.json()
          assert h.get("truthful") is True, r.text
          assert h.get("status") in {"healthy", "degraded"}, r.text
          assert h.get("truthful") is True, r.text
          if h.get("status") == "degraded":
              local = h.get("capabilities", {}).get("local", {})
              assert local.get("media_core") is False, r.text
          r = client.get("/infinity/reality/health")
          assert r.status_code == 200, r.text
          rh = r.json()
          assert rh.get("enabled") is True, r.text
          assert rh.get("canonical_truth") == "filesystem_and_independent_inspection", r.text
          r = client.get("/")
          assert r.status_code == 200, r.text
          assert "AI Infinity" in r.text
          assert "Create real content" in r.text
          assert "Reality Kernel" in r.text
          print("standalone-runtime-ok")
          PY

      - name: Verify professional closure regression tests
        run: |
          python -m pytest -q tests/test_production_closure.py tests/test_production_fallback.py tests/test_professional_creator_system.py tests/test_project_state_backend.py tests/test_cinematic_source_quality_gate.py

      - name: Verify browser shell JavaScript syntax
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path
          html=Path("ui_3800.html").read_text(encoding="utf-8")
          scripts=re.findall(r"<script>(.*?)</script>",html,re.S)
          assert scripts, "No browser script found"
          Path("/tmp/ui_3800.js").write_text("\n".join(scripts),encoding="utf-8")
          PY
          node --check /tmp/ui_3800.js

      - name: Build portable image
        run: docker build --platform linux/amd64 --tag ai-infinity:ci .
      - name: Verify live read-only API Anything operation through AI Infinity adapter
        shell: bash
        run: |
          set -euo pipefail
          result="$(docker run --rm --platform linux/amd64 --entrypoint python ai-infinity:ci -S -u -c 'import json; from api_anything_connector import execute_bundled_read_only; print(json.dumps(execute_bundled_read_only("hacker-news", "search", {"query": "sqlite"})))')"
          printf '%s' "$result" | python -c '
          import json, sys
          result = json.load(sys.stdin)
          assert result.get("status") == "completed", {"status": result.get("status"), "error_type": result.get("error_type")}
          assert result.get("executed") is True and result.get("read_only") is True, result
          assert result.get("transport_tier") == 1, {"tier": result.get("transport_tier")}
          data = result.get("result")
          assert isinstance(data, list) and data, "dynamic AI Infinity adapter returned no records"
          assert all(isinstance(item, dict) and item.get("title") for item in data), "results lack titles"
          print(json.dumps({"status": "verified", "provider": result["provider"], "operation": result["site"] + "." + result["operation"], "tier": result["transport_tier"], "result_count": len(data), "first_title": data[0]["title"], "truthful": True}))
          '
      - name: Start image and verify HTTP
        run: |
          set -euo pipefail
          # Match the free Render memory envelope and preserve the container
          # after an early crash so the actual bootstrap logs remain available.
          docker rm -f ai-infinity-ci >/dev/null 2>&1 || true
          # Bind-mount only this job's disposable state so the exact artifacts can
          # be reviewed even if OOM kills/removes the producer container. This is
          # ephemeral CI evidence, not a claim of durable production storage.
          mkdir -p /tmp/ai-infinity-container-data
          # The production image runs as UID 10001. Give that UID write access
          # while retaining the runner group as readers, so project data survives
          # container exit and can be copied into the review packet by the runner.
          RUNNER_GID="$(id -g)"
          sudo chown "10001:$RUNNER_GID" /tmp/ai-infinity-container-data
          sudo chmod 2770 /tmp/ai-infinity-container-data
          docker run -d --name ai-infinity-ci --platform linux/amd64 \
            --memory=512m --memory-swap=512m \
            -v /tmp/ai-infinity-container-data:/tmp/ai-infinity \
            -e AI_INFINITY_3601_BACKGROUND=false \
            -e AI_INFINITY_FAST_MODE=1 \
            -e AI_INFINITY_FFMPEG_THREADS=1 \
            -e AI_INFINITY_FFMPEG_FILTER_THREADS=1 \
            -e AI_INFINITY_FFMPEG_COMPLEX_THREADS=1 \
            -e AI_INFINITY_DATA_DIR=/tmp/ai-infinity \
            -p 10000:10000 ai-infinity:ci
          ready=0
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:10000/health >/tmp/health.json; then
              cat /tmp/health.json
              curl -fsS http://127.0.0.1:10000/infinity/3800/health >/tmp/creator-health.json
              cat /tmp/creator-health.json
              curl -fsS http://127.0.0.1:10000/ >/tmp/index.html
              grep -q "AI Infinity" /tmp/index.html
              docker exec ai-infinity-ci sh -lc 'AI_INFINITY_DATA_DIR=/tmp/ai-infinity-selftest AI_INFINITY_3601_BACKGROUND=false python -m ai_infinity.selftest'
              echo "container-runtime-ok"
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "Container did not become ready"
            docker inspect ai-infinity-ci || true
            docker logs ai-infinity-ci || true
            exit 1
          fi

          # Regression test for the exact Blitz failure mode seen previously:
          # a persisted malformed Start Command must not replace main:app.
          docker stop ai-infinity-ci >/dev/null
          docker rm ai-infinity-ci >/dev/null 2>&1 || true
          docker run -d --rm --name ai-infinity-ci --platform linux/amd64 \
            -v /tmp/ai-infinity-container-data:/tmp/ai-infinity \
            -e AI_INFINITY_3601_BACKGROUND=false -e AI_INFINITY_FAST_MODE=0 \
            -e AI_INFINITY_DATA_DIR=/tmp/ai-infinity -p 10000:10000 ai-infinity:ci \
            "[sh,-c,exec uvicorn ai_infinity_app:app --host 0.0.0.0 --port 10000]"
          ready=0
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:10000/infinity/studio/system/readiness > /tmp/closure-readiness.json; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1
          python - <<'PY'
          import json
          x=json.load(open("/tmp/closure-readiness.json"))
          assert x.get("version") == "TARGET-2050.3624", x
          assert x.get("production_policy",{}).get("strict_visuals") is True, x
          assert x.get("production_policy",{}).get("strict_research") is True, x
          print("stale-command-entrypoint-and-closure-ready")
          PY

          curl -fsS http://127.0.0.1:10000/infinity/divine/health > /tmp/divine-health.json
          cat /tmp/divine-health.json
          python - <<'PY'
          import json
          x=json.load(open("/tmp/divine-health.json"))
          assert x.get("content_creation_ready") is True, x
          assert x.get("reality_kernel", {}).get("patched") is True, x
          PY

          curl -fsS -X POST http://127.0.0.1:10000/infinity/3800/self-test > /tmp/local-self-test.json
          cat /tmp/local-self-test.json
          python - <<'PY'
          import json
          x=json.load(open("/tmp/local-self-test.json"))
          assert x.get("status")=="passed", x
          assert x.get("local_only") is True, x
          assert x.get("external_provider_required") is False, x
          PY

          # The stale-entrypoint regression is intentionally isolated from the
          # real-production server. Never run the production smoke inside the
          # alternate command/container because its module/bootstrap boundary
          # can diverge from the canonical main:app process.
          docker stop ai-infinity-ci >/dev/null
          docker rm ai-infinity-ci >/dev/null 2>&1 || true
          # Preserve the exited container until review artifacts have been copied.
          # An OOM/worker crash must not auto-delete the only output filesystem.
          docker run -d --name ai-infinity-ci --platform linux/amd64             -e AI_INFINITY_3601_BACKGROUND=false             -e AI_INFINITY_FAST_MODE=0             -e AI_INFINITY_DATA_DIR=/tmp/ai-infinity             -p 10000:10000 ai-infinity:ci
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:10000/health >/tmp/restarted-health.json; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1
          curl -fsS http://127.0.0.1:10000/infinity/canonical/health >/tmp/restarted-canonical-health.json
          cat /tmp/restarted-canonical-health.json
          python - <<'PY'
          import json
          x=json.load(open("/tmp/restarted-canonical-health.json"))
          assert x.get("truthful") is True, x
          print("fresh-canonical-runtime-ready")
          PY

      - name: Run real creator production smoke test
        env:
          AI_INFINITY_REQUIRE_SOURCE_VISUALS: "1"
          AI_INFINITY_REQUIRE_RESEARCH_EVIDENCE: "0"
          AI_INFINITY_FAST_MODE: "0"
          AI_INFINITY_3601_BACKGROUND: "false"
          AI_INFINITY_DATA_DIR: /tmp/ai-infinity-real-smoke
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p = {
            "title": "ONE IDEA. INFINITE WORLDS.",
            "objective": "Create an extraordinary 60-second cinematic brand film for AI Infinity titled “ONE IDEA. INFINITE WORLDS.”\n\nThe film must feel like a premium global technology brand campaign combined with an emotional short film—not a generic AI advertisement, slideshow, stock-footage montage, or screen-recording tutorial.\n\nCORE IDEA\n\nA person has one powerful idea late at night. At first, it exists only in their imagination. The room transforms into a series of vivid cinematic worlds as that single idea becomes a researched story, a script, a visual experience, a professionally edited film, and a finished creative package. Reveal AI Infinity as the connected creative system behind the journey.\n\nSTORY AND PACING\n\n0–4 seconds — The hook. Open immediately on a breathtaking cinematic image with a surprising visual transition. A lone creator looks at a blank screen. Voiceover: “Every extraordinary world begins with something nobody else can see.”\n\n4–12 seconds — The spark. A single idea appears. The creator enters a world of possibilities: dramatic landscapes, a futuristic city, human emotion, and an ambitious vision. Each shot must tell part of the same story.\n\n12–25 seconds — The transformation. Show the idea becoming researched, structured and written content. Move from source discovery to a clear narrative, storyboards, distinct scenes and compelling narration. Make the transitions visually motivated, not random.\n\n25–40 seconds — The cinematic experience. Deliver the strongest sequence of the film: beautiful compositions, deliberate camera movement, diverse shot sizes, atmospheric lighting, meaningful transitions, convincing depth, and an emotionally engaging visual progression. Every scene must be relevant to the story and materially different from the previous one.\n\n40–49 seconds — The craft. Show professional editing, a coherent timeline, synchronized captions, a balanced soundtrack, and the transformation into a finished video. Briefly communicate that real creative work should be editable, verifiable and recoverable—not just generated once.\n\n49–56 seconds — The payoff. Bring the story and the creator together in one memorable cinematic reveal. The idea that once existed only in imagination is now a complete creative work. Voiceover: “Research it. Shape it. Bring it to life. Then make it better.”\n\n56–60 seconds — The signature ending. A beautiful, restrained AI Infinity logo reveal against a deep cinematic background. Final line: “AI Infinity. One idea. Infinite worlds.”\n\nVISUAL DIRECTION\n\nUse a sophisticated filmic look: deep midnight blues, controlled cyan and violet highlights, warm gold practical lights, rich natural textures, atmospheric depth, carefully composed frames, smooth motivated camera movement, and premium typography. Build visual contrast between quiet intimate moments and expansive cinematic reveals. Avoid excessive neon, cheap particle effects, random zooms, repeated imagery, distorted text, cluttered overlays and artificial-looking transitions.\n\nVOICE, MUSIC AND SOUND\n\nWrite original, emotionally intelligent narration that fits the actual runtime. Use a natural, expressive English neural voice when available and verify the real voice provider. Compose a coherent musical arc that begins intimate, grows progressively, reaches a powerful but controlled climax, and resolves cleanly. Use subtle sound design to connect transitions. Keep narration intelligible, programme audio balanced, and the ending clean.\n\nPRODUCTION REQUIREMENTS\n\nCreate an actual video through the AI Infinity production workflow. Target 1920×1080, 16:9, exactly 60 seconds, with multiple distinct rendered scenes, meaningful visual continuity, readable synchronized captions, and a professionally mixed audio track.\n\nResearch and select genuinely relevant visual sources. Prefer verified public-domain or clearly licensed assets; preserve source URLs, creator information, applicable licence and attribution requirements, provenance, and per-asset integrity evidence. Do not invent research, sources, permissions, footage, AI-provider usage, or product capabilities. Use free-first execution and do not invoke paid services.\n\nThe story must reflect capabilities that AI Infinity can genuinely demonstrate. Do not fabricate UI screens or imply that a feature works merely because it appears in the film. If suitable footage, a required provider, or reliable rights evidence is unavailable, expose that limitation and retain REVIEW_REQUIRED status instead of silently substituting misleading assets.\n\nQUALITY CONTROL BEFORE DELIVERY\n\nIndependently inspect the final MP4 with FFprobe and perform a full media decode. Verify the requested duration, resolution, video and audio streams, actual scene count, visual diversity, narration, caption timing, audio levels, source relevance, rights evidence, and manifest hashes. Inspect representative frames throughout the whole film—not just its opening.\n\nGenerate a thumbnail, final script, captions.srt, audio_master.mp3, narration-only audio where supported, sources.json, provenance records, rights manifest, production manifest, a complete downloadable package.zip, and an honest human-review packet. Preserve the editable project and timeline where supported.\n\nDo not claim success merely because rendering finishes. If a critical requirement fails, explain the actual failure and retain the review or delivery gate. Finish with the real downloadable video and the evidence needed for a human creative review.\n\nSUCCESS STANDARD: The first four seconds must earn attention, every scene must advance the story, the emotional payoff must feel deserved, and the final film must look and sound intentionally crafted. Make every second count.",
            "topic": "AI Infinity — One Idea. Infinite Worlds.",
            "format": "video",
            "duration": 60,
            "content_type": "video",
            "audience": "general audience",
            "tone": "cinematic, clear, encouraging",
            "language": "English",
            "aspect_ratio": "16:9",
            "quality_preset": "high",
            "features": []
          }
          open("/tmp/create.json","w").write(json.dumps(p))
          PY
          curl -fsS -c /tmp/cookies.txt -b /tmp/cookies.txt \
            -H 'content-type: application/json' \
            --data-binary @/tmp/create.json \
            http://127.0.0.1:10000/infinity/divine/create > /tmp/create-response.json
          cat /tmp/create-response.json
          PROJECT_ID=$(python - <<'PY'
          import json
          x=json.load(open("/tmp/create-response.json"))
          print(x["project_id"])
          PY
          )
          test -n "$PROJECT_ID"

          status=""
          for i in $(seq 1 240); do
            curl -fsS -c /tmp/cookies.txt -b /tmp/cookies.txt \
              "http://127.0.0.1:10000/infinity/studio/project/$PROJECT_ID" > /tmp/project.json
            python - <<'PY' >/tmp/status.txt
          import json
          x=json.load(open("/tmp/project.json"))
          print(x.get("status",""), x.get("stage",""), x.get("progress",0))
          if x.get("error"):
              print("ERROR:", x["error"])
          PY
            cat /tmp/status.txt
            status=$(python - <<'PY'
          import json
          print(json.load(open("/tmp/project.json")).get("status",""))
          PY
          )
            case "$status" in
              completed|completed_with_qc_warnings) break ;;
              failed|cancelled)
                cat /tmp/project.json
                docker logs ai-infinity-ci || true
                exit 1
                ;;
            esac
            sleep 2
          done
          case "$status" in
            completed|completed_with_qc_warnings) ;;
            *) cat /tmp/project.json; docker logs ai-infinity-ci || true; exit 1 ;;
          esac

          # Explicitly create the editable timeline and portable media bundle.
          # Its result carries its own truth/durability state and remains separate
          # from project verification; missing OTIO is reported as a closure gap.
          otio_http=$(curl -sS -o /tmp/otio-export.json -w "%{http_code}" \
            -c /tmp/cookies.txt -b /tmp/cookies.txt -X POST \
            "http://127.0.0.1:10000/infinity/pro2/project/$PROJECT_ID/timeline/otio/export" || true)
          cat /tmp/otio-export.json || true
          if [ "$otio_http" = "200" ]; then
            echo "OPEN_TIMELINE_IO_EXPORT_PASS"
          else
            printf 'OTIO export endpoint returned HTTP %s\n' "${otio_http:-unavailable}" > /tmp/otio-export-warning.txt
            echo "OPEN_TIMELINE_IO_EXPORT_REVIEW_REQUIRED"
          fi

          curl -fsS -c /tmp/cookies.txt -b /tmp/cookies.txt \
            "http://127.0.0.1:10000/infinity/studio/project/$PROJECT_ID/artifacts" > /tmp/artifacts.json
          cat /tmp/artifacts.json
          curl -fsS -c /tmp/cookies.txt -b /tmp/cookies.txt \
            "http://127.0.0.1:10000/infinity/studio/project/$PROJECT_ID/verify" > /tmp/verify.json
          cat /tmp/verify.json
          python - <<'PY'
          import json
          verify=json.load(open("/tmp/verify.json"))
          assert verify.get("passed") is True, verify
          reality_project_id = json.load(open("/tmp/project.json"))["project_id"]
          reality_response = __import__("subprocess").check_output([
              "curl","-fsS","-c","/tmp/cookies.txt","-b","/tmp/cookies.txt",
              f"http://127.0.0.1:10000/infinity/reality/project/{reality_project_id}"
          ], text=True)
          reality=json.loads(reality_response)
          open("/tmp/reality-proof.json","w",encoding="utf-8").write(
              json.dumps(reality,indent=2,sort_keys=True)+"\n"
          )
          print("REALITY_PROOF_REPORT", json.dumps(reality, indent=2, sort_keys=True))
          proof_checks = {
              "truthful_bool": (reality.get("truthful") is True),
              "verified_bool": (reality.get("verified") is True),
              "state_verified": (reality.get("state") == "VERIFIED"),
              "qc_passed_bool": (reality.get("qc_passed") is True),
              "final_video": bool((reality.get("checks") or {}).get("final_has_video_stream")),
              "final_audio": bool((reality.get("checks") or {}).get("final_has_audio_stream")),
              "final_duration": bool((reality.get("checks") or {}).get("final_duration_gt_2s")),
              "manifest": bool((reality.get("checks") or {}).get("manifest.json")),
              "script": bool((reality.get("checks") or {}).get("script.md")),
              "captions": bool((reality.get("checks") or {}).get("captions.srt")),
              "thumbnail": bool((reality.get("checks") or {}).get("thumbnail.jpg")),
              "audio_master": bool((reality.get("checks") or {}).get("audio_master.mp3")),
          }
          print("REALITY_PROOF_FIELD_CHECKS", json.dumps(proof_checks, sort_keys=True))
          assert all(proof_checks.values()), {"proof_checks": proof_checks, "reality": reality}
          names={x["asset_name"] for x in json.load(open("/tmp/artifacts.json")).get("artifacts",[])}
          required={"final.mp4","captions.srt","thumbnail.jpg","manifest.json","script.md"}
          missing=required-names
          assert not missing, {"missing":sorted(missing),"names":sorted(names)}
          project=json.load(open("/tmp/project.json"))
          result=project.get("result") or {}
          quality=result.get("quality") or {}
          assert result.get("truthful") is True
          assert quality.get("passed") is True, quality
          print("REAL_CREATOR_PRODUCTION_SMOKE_PASS", project.get("project_id"))
          PY

          curl -fsS -c /tmp/cookies.txt -b /tmp/cookies.txt \
            "http://127.0.0.1:10000/infinity/studio/project/$PROJECT_ID/asset/final.mp4" -o /tmp/final.mp4
          curl -fsS -c /tmp/cookies.txt -b /tmp/cookies.txt \
            "http://127.0.0.1:10000/infinity/studio/project/$PROJECT_ID/asset/thumbnail.jpg" -o /tmp/thumbnail.jpg
          mkdir -p /tmp/ai-infinity-brand-film-review
          cp /tmp/final.mp4 /tmp/ai-infinity-brand-film-review/final.mp4
          cp /tmp/thumbnail.jpg /tmp/ai-infinity-brand-film-review/thumbnail.jpg
          for name in audio_master.mp3 narration_only.mp3 captions.srt script.md sources.json manifest.json production_manifest.json rights_manifest.json visual_rights.json provenance.json package.zip timeline.otio; do
            curl -fsS -c /tmp/cookies.txt -b /tmp/cookies.txt \
              "http://127.0.0.1:10000/infinity/studio/project/$PROJECT_ID/asset/$name" \
              -o "/tmp/ai-infinity-brand-film-review/$name" || rm -f "/tmp/ai-infinity-brand-film-review/$name"
          done
          test -s /tmp/final.mp4
          test -s /tmp/thumbnail.jpg
          ffprobe -v error -show_entries format=duration,size:stream=codec_type,codec_name,width,height -of json /tmp/final.mp4 > /tmp/final-probe.json
          cat /tmp/final-probe.json
          python - <<'PY'
          import json
          x=json.load(open("/tmp/final-probe.json"))
          duration=float((x.get("format") or {}).get("duration") or 0)
          streams=x.get("streams") or []
          video=next((s for s in streams if s.get("codec_type")=="video"), {})
          assert abs(duration - 60.0) <= 0.15, {"duration_seconds":duration,"expected_target_seconds":60}
          assert video, streams
          assert any(s.get("codec_type")=="audio" for s in streams), streams
          assert int(video.get("width") or 0) == 1920 and int(video.get("height") or 0) == 1080, {
              "width": video.get("width"), "height": video.get("height"), "expected": "1920x1080"
          }
          print("FINAL_MEDIA_DURATION_STREAMS_ASPECT_PASS", duration, video.get("width"), video.get("height"))
          subprocess.run(["ffmpeg","-v","error","-i","/tmp/final.mp4","-f","null","-"],check=True,timeout=240)
          print("FULL_MEDIA_DECODE_PASS")
          PY
          echo "END_TO_END_CREATOR_ARTIFACT_TEST_PASSED"


      - name: Assemble film assets, independent decode, frame sheet, integrity manifest, and human-review ZIP
        if: always()
        shell: bash
        run: |
          set +e
          REVIEW=/tmp/ai-infinity-brand-film-review
          mkdir -p "$REVIEW"
          docker ps -a > "$REVIEW/docker_containers.txt" 2>&1
          docker logs ai-infinity-ci > "$REVIEW/docker_runtime.log" 2>&1
          for path in /tmp/request.json /tmp/create-response.json /tmp/project.json /tmp/artifacts.json /tmp/verify.json /tmp/reality-proof.json /tmp/final-probe.json /tmp/otio-export.json /tmp/otio-export-warning.txt; do
            if [ -s "$path" ]; then cp "$path" "$REVIEW/"; fi
          done
          if [ -s /tmp/create-response.json ]; then
            PROJECT_ID=$(python -c 'import json; print(json.load(open("/tmp/create-response.json")).get("project_id",""))')
            if [[ "$PROJECT_ID" =~ ^studio_[A-Za-z0-9_-]+$ ]]; then
              printf '%s\n' "$PROJECT_ID" > "$REVIEW/project_id.txt"
              # The host bind mount is still available after docker exits/OOMs.
              CONTAINER_ROOT="/tmp/ai-infinity-container-data/creator_studio/$PROJECT_ID"
              if [ -d "$CONTAINER_ROOT" ]; then
                for name in final.mp4 master.mp4 thumbnail.jpg audio_master.mp3 narration_only.mp3 captions.srt script.md sources.json manifest.json production_manifest.json rights_manifest.json visual_rights.json provenance.json asset_registry.json production_truth.json timeline.json; do
                  if [ -s "$CONTAINER_ROOT/$name" ]; then cp -- "$CONTAINER_ROOT/$name" "$REVIEW/$name"; fi
                done
                PACKAGE_PATH=$(find "$CONTAINER_ROOT" -maxdepth 1 -type f -name 'package.zip' -print -quit)
                if [ -n "$PACKAGE_PATH" ]; then cp -- "$PACKAGE_PATH" "$REVIEW/package.zip"; fi
                NAMED_PACKAGE=$(find "$CONTAINER_ROOT" -maxdepth 1 -type f -iname '*creator-package*.zip' -print -quit)
                if [ -n "$NAMED_PACKAGE" ]; then cp -- "$NAMED_PACKAGE" "$REVIEW/named_creator_package.zip"; fi
                OTIO_PATH=$(find "$CONTAINER_ROOT" -maxdepth 1 -type f -iname '*.otio' -print -quit)
                if [ -n "$OTIO_PATH" ]; then cp -- "$OTIO_PATH" "$REVIEW/timeline.otio"; fi
                OTIO_BUNDLE=$(find "$CONTAINER_ROOT" -maxdepth 1 -type f -iname 'timeline-export*.zip' -print -quit)
                if [ -n "$OTIO_BUNDLE" ]; then cp -- "$OTIO_BUNDLE" "$REVIEW/timeline-export.zip"; fi
              else
                echo "Review-only host-mounted project directory was not created; no final media was substituted." > "$REVIEW/review_export_warning.txt"
              fi
              # Collect remaining accessible metadata only as a fallback; a failed
              # gated public download is never misrepresented as a successful export.
              for name in audio_master.mp3 narration_only.mp3 captions.srt script.md sources.json manifest.json production_manifest.json rights_manifest.json visual_rights.json provenance.json; do
                if [ ! -s "$REVIEW/$name" ] && [ -s /tmp/cookies.txt ] && curl -fsS http://127.0.0.1:10000/health >/dev/null 2>&1; then
                  curl -fsS -c /tmp/cookies.txt -b /tmp/cookies.txt "http://127.0.0.1:10000/infinity/studio/project/$PROJECT_ID/asset/$name" -o "$REVIEW/$name" 2>/dev/null || rm -f "$REVIEW/$name"
                fi
              done
            else
              echo "Creator returned an invalid project identifier; review-only export aborted." > "$REVIEW/review_export_warning.txt"
            fi
          fi
          if [ -s "$REVIEW/final.mp4" ]; then
            ffprobe -v error -show_format -show_streams -of json "$REVIEW/final.mp4" > "$REVIEW/ffprobe.json" 2>"$REVIEW/ffprobe_error.txt"
            ffmpeg -hide_banner -loglevel error -i "$REVIEW/final.mp4" -f null - >"$REVIEW/full_decode.log" 2>&1
            if [ $? -eq 0 ]; then echo "PASS" > "$REVIEW/full_decode_status.txt"; else echo "FAIL" > "$REVIEW/full_decode_status.txt"; fi
            ffmpeg -hide_banner -loglevel error -i "$REVIEW/final.mp4" -vf "fps=1/5,scale=480:270,tile=4x3" -frames:v 1 "$REVIEW/contact_sheet.jpg" 2>"$REVIEW/contact_sheet_error.txt"
            ffmpeg -hide_banner -i "$REVIEW/final.mp4" -af ebur128=peak=true -f null - 2>"$REVIEW/audio_loudness.txt"
          fi
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path("/tmp/ai-infinity-brand-film-review")
          media=root/"final.mp4"
          probe={}
          if (root/"ffprobe.json").exists():
              try: probe=json.loads((root/"ffprobe.json").read_text(encoding="utf-8"))
              except Exception: probe={}
          streams=probe.get("streams",[])
          v=next((s for s in streams if s.get("codec_type")=="video"),{})
          a=next((s for s in streams if s.get("codec_type")=="audio"),{})
          fmt=probe.get("format",{})
          files=[]
          for p in sorted(root.rglob("*")):
              if p.is_file() and p.name not in {"integrity_manifest.json"}:
                  h=hashlib.sha256()
                  with p.open("rb") as f:
                      for chunk in iter(lambda:f.read(1024*1024),b""): h.update(chunk)
                  files.append({"path":str(p.relative_to(root)),"size_bytes":p.stat().st_size,"sha256":h.hexdigest()})
          project={}
          if (root/"project.json").is_file():
              try: project=json.loads((root/"project.json").read_text(encoding="utf-8"))
              except Exception: project={}
          result=project.get("result") if isinstance(project.get("result"),dict) else {}
          quality=result.get("quality") if isinstance(result.get("quality"),dict) else {}
          visual={}
          if (root/"visual_rights.json").is_file():
              try: visual=json.loads((root/"visual_rights.json").read_text(encoding="utf-8"))
              except Exception: visual={}
          coverage=quality.get("visual_source_coverage") if isinstance(quality.get("visual_source_coverage"),dict) else {}
          quality_checks=quality.get("checks") if isinstance(quality.get("checks"),dict) else {}
          scene_count=max(1,int(coverage.get("scene_count") or project.get("total_scenes") or 1))
          min_motion_sources=int(coverage.get("minimum_motion_sources") or max(3,int(scene_count*0.70+0.9999)))
          max_fallback_visuals=int(coverage.get("maximum_fallback_visuals") or max(1,int(scene_count*0.15)))
          source_motion_count=int(coverage.get("distinct_verified_motion_sources") or 0)
          fallback_count=int(coverage.get("fallback_visual_count") or 0)
          creative_visual_gate=(
              coverage.get("required") is True
              and source_motion_count>=min_motion_sources
              and fallback_count<=max_fallback_visuals
              and quality_checks.get("required_source_motion_coverage") is True
              and quality_checks.get("fallback_visual_budget_ok") is True
          )
          technical_spec="PASS" if media.is_file() and fmt and abs(float(fmt.get("duration") or 0)-60.0)<=0.15 and int(v.get("width") or 0)==1920 and int(v.get("height") or 0)==1080 and (root/"full_decode_status.txt").exists() and (root/"full_decode_status.txt").read_text().strip()=="PASS" else "REVIEW_REQUIRED"
          editable_timeline_gate=(
              (root/"timeline.otio").is_file()
              and (root/"timeline-export.zip").is_file()
              and not (root/"otio-export-warning.txt").exists()
          )
          creator_package_gate=(root/"package.zip").is_file()
          release_spec="PASS" if (
              technical_spec=="PASS"
              and quality.get("passed") is True
              and creative_visual_gate
              and editable_timeline_gate
              and creator_package_gate
          ) else "REVIEW_REQUIRED"
          integrity={
            "truthful":True,"generator":"AI Infinity real container workflow (GitHub Actions)",
            "project_id":(root/"project_id.txt").read_text().strip() if (root/"project_id.txt").exists() else None,
            "media_available":media.is_file(),
            "duration_seconds":float(fmt.get("duration") or 0) if fmt else None,
            "width":v.get("width"),"height":v.get("height"),
            "video_codec":v.get("codec_name"),"audio_codec":a.get("codec_name"),
            "video_stream_present":bool(v),"audio_stream_present":bool(a),
            "full_decode":"PASS" if (root/"full_decode_status.txt").exists() and (root/"full_decode_status.txt").read_text().strip()=="PASS" else "NOT_VERIFIED_OR_FAILED",
            "contact_sheet_available":(root/"contact_sheet.jpg").is_file(),
            "captions_available":(root/"captions.srt").is_file(),
            "sources_evidence_available":(root/"sources.json").is_file(),
            "rights_or_visual_rights_evidence_available":any((root/n).is_file() for n in ("rights_manifest.json","visual_rights.json")),
            "editable_timeline_available":(root/"timeline.otio").is_file(),
            "editable_timeline_bundle_available":(root/"timeline-export.zip").is_file(),
            "editable_timeline_gate":"PASS" if editable_timeline_gate else "REVIEW_REQUIRED",
            "creator_package_available":creator_package_gate,
            "source_motion_scene_count":source_motion_count,
            "minimum_source_motion_scenes":min_motion_sources,
            "fallback_visual_count":fallback_count,
            "maximum_fallback_visuals":max_fallback_visuals,
            "creative_visual_gate":"PASS" if creative_visual_gate else "REVIEW_REQUIRED",
            "technical_spec_gate":technical_spec,
            "spec_gate":release_spec,
            "ai_infinity_quality_gate":"PASS" if quality.get("passed") is True else "REVIEW_REQUIRED",
            "human_creative_review":"PENDING",
            "files":files
          }
          (root/"integrity_manifest.json").write_text(json.dumps(integrity,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          missing=[]
          for label,names in [("final MP4",["final.mp4"]),("creator package",["package.zip"]),("thumbnail",["thumbnail.jpg"]),("captions",["captions.srt"]),("programme audio master",["audio_master.mp3"]),("sources",["sources.json"]),("rights evidence",["rights_manifest.json","visual_rights.json"]),("editable OTIO timeline",["timeline.otio"]),("portable timeline bundle",["timeline-export.zip"])]:
              if not any((root/n).exists() for n in names): missing.append(label)
          duration=integrity["duration_seconds"]
          spec=integrity["spec_gate"]
          notes=[
            "# AI Infinity — ONE IDEA. INFINITE WORLDS. | Human Review Packet",
            "",
            "## Evidence source",
            "Generated by the real AI Infinity application inside the current GitHub Actions Docker runtime via /infinity/divine/create; this is CI-hosted production, not a live Render deployment.",
            "Media copied from this isolated run's project directory is for human review only; it does not override any failed verification or authorize production release.",
            "",
            "## Technical target check",
            f"- 60-second / 1920×1080 technical target: **{integrity['technical_spec_gate']}**",
            f"- Professional visual/source gate: **{integrity['creative_visual_gate']}**",
            f"- Editable timeline and package gate: **{integrity['editable_timeline_gate']} / {'PASS' if integrity['creator_package_available'] else 'REVIEW_REQUIRED'}**",
            f"- Verified distinct source-motion scenes: {integrity['source_motion_scene_count']}/{integrity['minimum_source_motion_scenes']} required",
            f"- Explicitly labelled fallback visuals: {integrity['fallback_visual_count']} (maximum allowed: {integrity['maximum_fallback_visuals']})",
            f"- Actual duration: {duration} seconds",
            f"- Actual resolution: {v.get('width')}×{v.get('height')}",
            f"- Video codec: {v.get('codec_name')}; audio codec: {a.get('codec_name')}",
            f"- Full decode: {integrity['full_decode']}",
            f"- Contact sheet: {'available' if integrity['contact_sheet_available'] else 'not available'}",
            "",
            "## Creative and rights review",
            "- Human creative review: **PENDING — not yet reviewed or approved**",
            "- Inspect the first 4 seconds, scene variation, story continuity, typography, pacing and emotional payoff.",
            "- Verify voice provider from genuine production evidence; do not infer neural voice from a voice name.",
            "- Check narration clarity, music balance, caption synchronization, loudness and ending.",
            "- Verify sources, creator, source URL, licence, attribution and provenance for each external asset.",
            "- If rights, provider, provenance, recovery or quality evidence is missing or uncertain, retain REVIEW_REQUIRED.",
            "",
            "## Missing items (automatically detected)",
            *(["- None of the required media is missing from the basic review packet."] if not missing else [f"- Missing: {', '.join(missing)}"]),
            "",
            "## Files and integrity",
            "integrity_manifest.json lists only files actually collected, with SHA-256 hashes, sizes and stream metadata.",
            "",
            "## Remaining release gates",
            "- Live Render deployment remains blocked while the configured service is suspended.",
            "- Durable object storage PUT→HEAD→GET→SHA and restart/fresh-instance recovery must be verified separately.",
            "- Human/native-language creative review and rights acceptance remain open until an authorized reviewer completes them."
          ]
          (root/"human_review_packet.md").write_text("\n".join(notes)+"\n",encoding="utf-8")
          print(json.dumps({"review_packet":str(root/"human_review_packet.md"),"integrity_manifest":str(root/"integrity_manifest.json"),"spec_gate":spec,"duration_seconds":duration,"resolution":[v.get("width"),v.get("height")],"missing":missing},indent=2))
          PY
          cd "$REVIEW" && zip -qr /tmp/AI_Infinity_ONE_IDEA_INFINITE_WORLDS_human_review.zip .
          echo "Brand-film evidence collection completed; review gates are recorded in the packet."
      - name: Upload standalone production closure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-infinity-standalone-production-evidence
          path: |
            /tmp/create-response.json
            /tmp/project.json
            /tmp/artifacts.json
            /tmp/verify.json
            /tmp/reality-proof.json
            /tmp/final-probe.json
            /tmp/final.mp4
            /tmp/thumbnail.jpg
            /tmp/AI_Infinity_ONE_IDEA_INFINITE_WORLDS_human_review.zip
            /tmp/ai-infinity-brand-film-review/**
            /tmp/ai-infinity-real-smoke/**/*.json
            /tmp/ai-infinity-real-smoke/**/*.md
          if-no-files-found: warn

      - name: Stop test container
        if: always()
        run: |
          docker logs ai-infinity-ci || true
          docker stop ai-infinity-ci || true
