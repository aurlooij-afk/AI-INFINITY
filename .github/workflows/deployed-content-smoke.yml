name: AI Infinity Deployed Content Smoke

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/deployed-content-smoke.yml"

jobs:
  deployed-content-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify the live canonical shell
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://ai-infinity-ca5e.onrender.com"
          mkdir -p /tmp/ai-infinity-smoke
          curl --fail --silent --show-error --location --retry 4 --retry-delay 4 --retry-all-errors --connect-timeout 15 --max-time 90 -D /tmp/ai-infinity-smoke/headers "$BASE_URL/" -o /tmp/ai-infinity-smoke/root.html
          grep -q "AI Infinity" /tmp/ai-infinity-smoke/root.html
          grep -q "REAL CONTENT PRODUCTION" /tmp/ai-infinity-smoke/root.html
          grep -q "Create real content" /tmp/ai-infinity-smoke/root.html
          grep -qi "x-ai-infinity-ui: 3706-canonical" /tmp/ai-infinity-smoke/headers
          ! grep -q "TARGET-2050.3623" /tmp/ai-infinity-smoke/root.html
          echo "Live canonical shell verified."

      - name: Create and verify real content on the deployed service
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://ai-infinity-ca5e.onrender.com"
          COOKIE="/tmp/ai-infinity-smoke/cookies.txt"
          PAYLOAD="/tmp/ai-infinity-smoke/create.json"
          STATUS="/tmp/ai-infinity-smoke/status.json"
          ARTIFACTS="/tmp/ai-infinity-smoke/artifacts.json"
          SUMMARY="/tmp/ai-infinity-smoke/summary.json"
          ANALYTICS="/tmp/ai-infinity-smoke/analytics.json"

          cat > "$PAYLOAD" <<'JSON'
          {
            "title": "AI Infinity Deployed Smoke",
            "objective": "Create a useful 20-second explainer about renewable energy.",
            "topic": "renewable energy",
            "format": "short",
            "duration": 20,
            "content_type": "video",
            "language": "English",
            "aspect_ratio": "9:16"
          }
          JSON

          curl --fail --silent --show-error --location --retry 4 --retry-delay 4 --retry-all-errors --connect-timeout 15 --max-time 90             -c "$COOKIE" -b "$COOKIE"             -H "Content-Type: application/json"             --data-binary "@$PAYLOAD"             "$BASE_URL/infinity/studio/project" > /tmp/ai-infinity-smoke/create-response.json

          python - <<'PY'
          import json, pathlib
          d=json.loads(pathlib.Path("/tmp/ai-infinity-smoke/create-response.json").read_text())
          pid=d.get("project_id")
          if not pid:
              raise SystemExit("Deployed creation returned no project_id: "+str(d)[:2000])
          pathlib.Path("/tmp/ai-infinity-smoke/project_id").write_text(pid)
          print("Deployed project:", pid)
          PY

          PROJECT_ID="$(cat /tmp/ai-infinity-smoke/project_id)"
          DEADLINE=$(( $(date +%s) + 180 ))
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            curl --fail --silent --show-error --location --retry 2 --retry-delay 2 --retry-all-errors --connect-timeout 15 --max-time 60               -c "$COOKIE" -b "$COOKIE"               "$BASE_URL/infinity/studio/project/$PROJECT_ID" > "$STATUS"
            STATUS_VALUE="$(python - <<'PY'
          import json
          d=json.load(open("/tmp/ai-infinity-smoke/status.json"))
          print(d.get("status") or "")
          PY
            )"
            echo "Deployed production status: $STATUS_VALUE"
            case "$STATUS_VALUE" in
              completed|completed_with_qc_warnings) break ;;
              failed|cancelled) cat "$STATUS"; exit 1 ;;
            esac
            sleep 2
          done

          FINAL_STATUS="$(python - <<'PY'
          import json
          d=json.load(open("/tmp/ai-infinity-smoke/status.json"))
          print(d.get("status") or "")
          PY
          )"
          test "$FINAL_STATUS" = "completed" -o "$FINAL_STATUS" = "completed_with_qc_warnings"

          for NAME in final.mp4 thumbnail.jpg captions.srt script.md audio_master.mp3 manifest.json sources.json package.zip; do
            curl --fail --silent --show-error --location --retry 3 --retry-delay 2 --retry-all-errors --connect-timeout 15 --max-time 60               -c "$COOKIE" -b "$COOKIE"               "$BASE_URL/infinity/studio/project/$PROJECT_ID/asset/$NAME"               -o "/tmp/ai-infinity-smoke/$NAME"
            test -s "/tmp/ai-infinity-smoke/$NAME"
          done

          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 --retry-all-errors --connect-timeout 15 --max-time 60             -c "$COOKIE" -b "$COOKIE"             "$BASE_URL/infinity/studio/project/$PROJECT_ID/artifacts" -o "$ARTIFACTS"

          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 --retry-all-errors --connect-timeout 15 --max-time 60             -c "$COOKIE" -b "$COOKIE"             "$BASE_URL/infinity/studio/workspace/summary" -o "$SUMMARY"

          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 --retry-all-errors --connect-timeout 15 --max-time 60             -c "$COOKIE" -b "$COOKIE"             "$BASE_URL/infinity/studio/analytics" -o "$ANALYTICS"

          python - <<'PY'
          import json, pathlib, zipfile
          pid=pathlib.Path("/tmp/ai-infinity-smoke/project_id").read_text().strip()
          artifacts=json.load(open("/tmp/ai-infinity-smoke/artifacts.json"))
          if not (artifacts.get("artifacts") or []):
              raise SystemExit("Deployed artifact registry is empty")
          summary=json.load(open("/tmp/ai-infinity-smoke/summary.json"))
          raw=json.load(open("/tmp/ai-infinity-smoke/analytics.json"))
          analytics=raw.get("analytics") or raw
          if int(summary.get("projects") or 0) < 1:
              raise SystemExit("Deployed workspace summary did not record the project: "+str(summary))
          if int(analytics.get("projects_total") or 0) < 1:
              raise SystemExit("Deployed analytics did not record the project: "+str(raw))
          if int(analytics.get("artifact_count") or 0) < 1:
              raise SystemExit("Deployed analytics did not record artifacts: "+str(raw))
          with zipfile.ZipFile("/tmp/ai-infinity-smoke/package.zip") as z:
              if z.testzip() is not None:
                  raise SystemExit("Deployed package.zip failed integrity check")
          print("DEPLOYED REAL CONTENT SMOKE PASSED:", pid)
          print("Artifacts:", len(artifacts.get("artifacts") or []))
          print("Analytics:", analytics)
          PY
