name: AI Infinity Production Graph Gate

on:
  push:
    branches:
      - ai-infinity-production-graph
  pull_request:
    branches:
      - main

jobs:
  production-graph-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile production application
        run: |
          python -m py_compile production_graph.py ai_infinity_app.py
          python -m py_compile studio_ultimate.py reality_first_3901.py ai_infinity_canonical.py
      - name: Import production graph
        run: python -c "import production_graph; print(production_graph.VERSION, production_graph.BUILD)"
