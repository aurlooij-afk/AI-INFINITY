services:
  - type: web
    name: ai-infinity
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: AI_INFINITY_DATA
        value: "/tmp/ai-infinity"
      - key: AI_INFINITY_WORKERS
        value: "6"
      - key: AI_INFINITY_HTTP_TIMEOUT
        value: "20"
