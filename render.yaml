services:
  - type: web
    name: ai-infinity
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /infinity/3601/health
    envVars:
      - key: AI_INFINITY_DATA_DIR
        value: /tmp/ai-infinity
      - key: AI_INFINITY_PORTFOLIO_CYCLE_SECONDS
        value: "90"
