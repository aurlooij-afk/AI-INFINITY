services:
  - type: web
    name: ai-infinity
    runtime: docker
    region: oregon
    plan: 2c-4g
    numInstances: 1
    maxShutdownDelaySeconds: 300
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    disk:
      name: ai-infinity-data
      mountPath: /var/lib/ai-infinity
      sizeGB: 20
    buildFilter:
      ignoredPaths:
        - .github/**
    autoDeployTrigger: commit
    envVars:
      - key: AI_INFINITY_OWNER_EMAIL
        value: aurlooij@gmail.com
      - key: AI_INFINITY_OWNER_NAME
        value: AI Infinity Owner
      - key: AI_INFINITY_DATA_DIR
        value: /var/lib/ai-infinity
      - key: AI_INFINITY_PERSISTENCE_MODE
        value: attached-disk
      - key: AI_INFINITY_3601_BACKGROUND
        value: "true"
      - key: AI_INFINITY_FAST_MODE
        value: "false"
      - key: AI_INFINITY_MAX_HEAVY_JOBS
        value: "1"
      - key: AI_INFINITY_FFMPEG_THREADS
        value: "1"
      - key: AI_INFINITY_FFMPEG_FILTER_THREADS
        value: "1"
      - key: AI_INFINITY_MEMORY_GUARD_PERCENT
        value: "0.75"
      - key: AI_INFINITY_MEMORY_RESERVE_MB
        value: "128"
      - key: AI_INFINITY_INTERMEDIATE_RETENTION_SECONDS
        value: "3600"
      - key: AI_INFINITY_STORAGE_PRIMARY
        value: cloudflare_r2
      - key: AI_INFINITY_STORAGE_REPLICAS
        value: oracle_object_storage,backblaze_b2,tigris,supabase
      - key: AI_INFINITY_STORAGE_MAX_UPLOAD_MB
        value: "250"
      - key: AI_INFINITY_STORAGE_PRESIGN_SECONDS
        value: "3600"