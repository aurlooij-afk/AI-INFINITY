services:
  - type: web
    name: ai-infinity
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: AI_INFINITY_DATA_DIR
        value: /tmp/ai-infinity
      - key: AI_INFINITY_3601_BACKGROUND
        value: "true"
      - key: AI_INFINITY_OPERATOR_TOKEN
        sync: false
      - key: AI_INFINITY_SESSION_SECRET
        sync: false
      - key: AI_INFINITY_AUTO_APPLY
        value: "false"
      - key: AI_INFINITY_APPLICATION_PROVIDER
        value: "authorized-application-bridge"
      - key: AI_INFINITY_SNAPSHOT_URL
        sync: false
      - key: AI_INFINITY_SNAPSHOT_TOKEN
        sync: false
      - key: AI_INFINITY_GITHUB_TOKEN
        sync: false
      - key: AI_INFINITY_GITHUB_REPO
        sync: false
      - key: AI_INFINITY_GITHUB_PATH
        value: ai-infinity/state/ai_infinity.db
      - key: AI_INFINITY_GITHUB_BRANCH
        value: main
      - key: AI_INFINITY_CRON_TOKEN
        sync: false
      - key: AI_INFINITY_DB_PATH
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_INFINITY_OLLAMA_URL
        sync: false
      - key: AI_INFINITY_MODEL_BASE_URL
        sync: false
      - key: AI_INFINITY_MODEL_API_KEY
        sync: false
      - key: AI_INFINITY_APPLICATION_API_KEY
        sync: false
      - key: AI_INFINITY_APPLICATION_SUBMIT_URL
        sync: false
      - key: AI_INFINITY_PAYMENT_WEBHOOK_SECRET
        sync: false
      - key: AI_INFINITY_PAYOUT_SUBMIT_URL
        sync: false
      - key: AI_INFINITY_PAYOUT_API_KEY
        sync: false
