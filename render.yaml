services:
  - type: web
    name: ai-infinity
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: AI_INFINITY_DATA_DIR
        value: /tmp/ai-infinity
      - key: AI_INFINITY_3601_BACKGROUND
        value: "true"
      - key: AI_INFINITY_OPERATOR_TOKEN
        sync: false
      - key: AI_INFINITY_VAULT_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: AI_INFINITY_MODEL_BASE_URL
        sync: false
      - key: AI_INFINITY_MODEL_API_KEY
        sync: false
      - key: AI_INFINITY_PAYMENT_WEBHOOK_SECRET
        sync: false
      - key: AI_INFINITY_PAYOUT_SUBMIT_URL
        sync: false
      - key: AI_INFINITY_PAYOUT_API_KEY
        sync: false
      - key: AI_INFINITY_APPLICATION_SUBMIT_URL
        sync: false
      - key: AI_INFINITY_APPLICATION_API_KEY
        sync: false
      - key: AI_INFINITY_AUTO_APPLY
        value: "false"
      - key: AI_INFINITY_SNAPSHOT_URL
        sync: false
      - key: AI_INFINITY_SNAPSHOT_TOKEN
        sync: false
